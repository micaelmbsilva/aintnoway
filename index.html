<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <meta name="description" content="Fast local forecast: today's summary, what to wear, hourly and 7-day." />
    <meta name="theme-color" content="#1d6fd0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <style>
      :root {
        color-scheme: light;
        --bg: #f9f9f7;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --baseline: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --temp: #eb6834;
        --rain: #2a78d6;
        --accent: #2a78d6;
        --accent-text: #ffffff;
        --chip: #f0efec;
        --error: #d03b3b;
        --feels: #4a3aa7;
        --clouds: #eda100;
        --humid: #e87ba4;
        --wind: #008300;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0d0d0d;
          --surface: #1a1a19;
          --text: #ffffff;
          --text-2: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --baseline: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --temp: #d95926;
          --rain: #3987e5;
          --accent: #3987e5;
          --accent-text: #ffffff;
          --chip: #262624;
          --error: #e66767;
          --feels: #9085e9;
          --clouds: #c98500;
          --humid: #d55181;
          --wind: #008300;
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d0d0d;
        --surface: #1a1a19;
        --text: #ffffff;
        --text-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --baseline: #383835;
        --border: rgba(255, 255, 255, 0.1);
        --temp: #d95926;
        --rain: #3987e5;
        --accent: #3987e5;
        --accent-text: #ffffff;
        --chip: #262624;
        --error: #e66767;
        --feels: #9085e9;
        --clouds: #c98500;
        --humid: #d55181;
        --wind: #008300;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 24px 16px;
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .topbar-actions {
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 16px;
        cursor: pointer;
        color: var(--text);
      }

      .btn-sm {
        padding: 4px 10px;
        font-size: 13px;
        border-radius: 8px;
      }

      .search {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        position: relative;
      }

      .search-box {
        flex: 1;
        position: relative;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
      }

      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      button.primary {
        padding: 13px 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        background: var(--accent);
        color: var(--accent-text);
      }

      .dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        z-index: 10;
        overflow: hidden;
        display: none;
      }

      .dropdown.open {
        display: block;
      }

      .dropdown-item {
        padding: 11px 14px;
        cursor: pointer;
        font-size: 15px;
      }

      .dropdown-item .sub {
        color: var(--muted);
        font-size: 13px;
      }

      .dropdown-item:hover,
      .dropdown-item.active {
        background: var(--chip);
      }

      .recents {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .chip {
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 14px;
        cursor: pointer;
        color: var(--text-2);
      }

      .chip:hover {
        color: var(--text);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        margin-bottom: 16px;
      }

      .card h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .place-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }

      .place-row h2 {
        margin: 0;
        font-size: 22px;
      }

      .now {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }

      .now .icon {
        font-size: 52px;
        line-height: 1;
      }

      .now .temp {
        font-size: 48px;
        font-weight: 600;
      }

      .now .cond {
        color: var(--text-2);
        font-size: 16px;
      }

      .now .cond .feels {
        color: var(--muted);
        font-size: 14px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      .metric b {
        font-size: 18px;
        font-weight: 600;
        display: block;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
      }

      .small {
        color: var(--muted);
        font-size: 13px;
      }

      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .statusbar button {
        background: none;
        border: none;
        padding: 6px 0;
        min-height: 44px;
        font: inherit;
        color: var(--accent);
        cursor: pointer;
      }

      .banner {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text-2);
      }

      .banner.show {
        display: flex;
      }

      .banner.offline {
        background: color-mix(in srgb, #d08a1e 18%, transparent);
        border-color: color-mix(in srgb, #d08a1e 45%, transparent);
        color: var(--text);
      }

      .banner .grow {
        flex: 1;
      }

      .banner button {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 14px;
        min-height: 40px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
      }

      .stale {
        opacity: 0.55;
        transition: opacity 0.2s;
      }

      /* Bottom sheet on phones, centred dialog from 760px up. */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 20;
      }

      .scrim.open {
        opacity: 1;
        pointer-events: auto;
      }

      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 21;
        background: var(--surface);
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
        transform: translateY(102%);
        transition: transform 0.24s ease;
        max-height: 85vh;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .sheet.open {
        transform: translateY(0);
      }

      .sheet .handle {
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: var(--border);
        margin: 4px auto 14px;
      }

      .sheet h3 {
        margin: 0 0 14px;
        font-size: 17px;
      }

      .opt-row {
        margin-bottom: 16px;
      }

      .opt-row > span {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .seg {
        display: flex;
        gap: 6px;
      }

      .seg button {
        flex: 1;
        min-height: 44px;
        padding: 10px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text-2);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .seg button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }

      @media (min-width: 760px) {
        .sheet {
          left: 50%;
          right: auto;
          bottom: auto;
          top: 50%;
          width: 420px;
          border-radius: 16px;
          border: 1px solid var(--border);
          transform: translate(-50%, -46%) scale(0.98);
          opacity: 0;
          transition:
            opacity 0.18s,
            transform 0.18s;
        }

        .sheet.open {
          transform: translate(-50%, -50%);
          opacity: 1;
        }
      }

      .today-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .hilo {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }

      .hilo .hi {
        font-size: 30px;
        font-weight: 600;
      }

      .hilo .lo {
        font-size: 22px;
        color: var(--muted);
      }

      .hilo .hilo-label {
        color: var(--muted);
        font-size: 13px;
      }

      .nowcast {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .nowcast .nc-text {
        font-size: 15px;
        color: var(--text);
        flex: 1 1 190px;
        min-width: 0;
      }

      .nowcast .nc-text b {
        font-weight: 600;
      }

      .nc-bars {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 44px;
        flex: 1 1 180px;
      }

      .nc-bars i {
        flex: 1;
        background: var(--rain);
        border-radius: 3px 3px 0 0;
        min-height: 2px;
        opacity: 0.85;
      }

      .nc-bars i.dry {
        background: var(--grid);
        opacity: 1;
      }

      .nc-axis {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        flex-basis: 100%;
      }

      .day-summary {
        margin: 12px 0 0;
        color: var(--text-2);
        font-size: 15px;
        line-height: 1.55;
      }

      .windows {
        margin: 10px 0 0;
        font-size: 14px;
        color: var(--text-2);
      }

      .day-context {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .aqi-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .aqi {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        height: 52px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #0b0b0b;
      }

      .aqi.good {
        background: #7fd18a;
      }

      .aqi.fair {
        background: #d9e07a;
      }

      .aqi.moderate {
        background: #f0c14b;
      }

      .aqi.poor {
        background: #ec8b5e;
      }

      .aqi.severe {
        background: #d95f6b;
        color: #ffffff;
      }

      .pollen-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .pollen {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--chip);
        font-size: 13px;
        color: var(--text-2);
      }

      .pollen.moderate {
        border-color: color-mix(in srgb, #f0c14b 60%, transparent);
      }

      .pollen.high {
        border-color: color-mix(in srgb, #d95f6b 60%, transparent);
        color: var(--text);
      }

      .scorecard {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--chip);
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.5;
      }

      .agreement {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .agree-dots {
        display: inline-flex;
        gap: 4px;
      }

      .agree-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--grid);
      }

      .agree-dots i.on {
        background: var(--rain);
      }

      .wear {
        margin-top: 14px;
        border-top: 1px solid var(--grid);
        padding-top: 12px;
      }

      .wear h4 {
        margin: 0 0 9px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }

      .wear-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .wear-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text-2);
        font-size: 13px;
      }

      @media (max-width: 520px) {
        .hilo .hi {
          font-size: 26px;
        }
      }

      .series-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .schip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text-2);
        font-size: 13px;
        cursor: pointer;
      }

      .schip .swatch {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
      }

      .schip.off {
        opacity: 0.55;
      }

      .schip.off .swatch {
        background: var(--muted) !important;
      }

      .overview {
        margin-top: 4px;
        position: relative;
      }

      .overview svg {
        width: 100%;
        height: auto;
        display: block;
        touch-action: none;
        cursor: grab;
      }

      .overview svg.dragging {
        cursor: grabbing;
      }

      .overview svg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      .chart-wrap svg {
        touch-action: pan-y;
      }

      .range-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 4px;
      }

      .range-controls {
        display: flex;
        gap: 6px;
      }

      .chart-wrap {
        position: relative;
      }

      .chart-wrap svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .tooltip {
        position: absolute;
        pointer-events: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        padding: 8px 10px;
        font-size: 13px;
        color: var(--text);
        display: none;
        white-space: nowrap;
        z-index: 5;
      }

      .tooltip .t-time {
        color: var(--muted);
        font-size: 12px;
      }

      details {
        margin-top: 14px;
      }

      summary {
        cursor: pointer;
        color: var(--text-2);
        font-size: 14px;
      }

      .table-wrap {
        overflow-x: auto;
        margin-top: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        padding: 9px 12px;
        text-align: left;
        border-bottom: 1px solid var(--grid);
        font-size: 14px;
        white-space: nowrap;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }

      .now-row td {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .now-row td:first-child {
        font-weight: 600;
      }

      .daily-row {
        display: grid;
        grid-template-columns: 82px 34px 1fr auto auto;
        align-items: center;
        gap: 10px;
        padding: 9px 6px;
        border-bottom: 1px solid var(--grid);
        font-size: 15px;
        background: none;
        border-left: none;
        border-right: none;
        border-top: none;
        width: 100%;
        font-family: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 8px;
      }

      .daily-row:hover {
        background: var(--chip);
      }

      .daily-row:last-child {
        border-bottom: none;
      }

      .daily-row .d-icon {
        font-size: 22px;
        text-align: center;
      }

      .daily-row .d-cond {
        color: var(--text-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .daily-row .d-rain {
        color: var(--text-2);
        font-size: 13px;
        text-align: right;
        min-width: 90px;
      }

      .daily-row .d-temps {
        text-align: right;
        min-width: 90px;
        font-variant-numeric: tabular-nums;
      }

      .daily-row .d-temps .lo {
        color: var(--muted);
      }

      .sun-row {
        margin-top: 12px;
        color: var(--text-2);
        font-size: 14px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .loading {
        color: var(--muted);
      }

      .error {
        color: var(--error);
      }

      @media (max-width: 520px) {
        body {
          padding: 16px 10px;
        }

        .card {
          padding: 16px;
        }

        .now .temp {
          font-size: 40px;
        }

        .daily-row {
          grid-template-columns: 60px 30px auto auto;
        }

        .daily-row .d-cond {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>🌤 Weather</h1>
        <div class="topbar-actions">
          <button id="shareBtn" class="icon-btn" title="Share this forecast" aria-label="Share this forecast">🔗</button>
          <button id="settingsBtn" class="icon-btn" title="Units and display" aria-label="Units and display" aria-haspopup="dialog">⚙️</button>
          <button id="themeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
        </div>
      </div>

      <div class="search">
        <div class="search-box">
          <input
            id="cityInput"
            placeholder="Search city…"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="dropdown" class="dropdown"></div>
        </div>
        <button class="primary" id="searchBtn">Check</button>
        <button class="icon-btn" id="geoBtn" title="Use my location" aria-label="Use my location">📍</button>
      </div>

      <div id="recents" class="recents"></div>

      <div id="offlineBanner" class="banner offline" role="status">
        <span class="grow" id="offlineText">Offline — showing the last forecast.</span>
      </div>

      <div id="installBanner" class="banner" role="note">
        <span class="grow">Add to your home screen for instant, offline-ready forecasts.</span>
        <button id="installBtn">Add</button>
        <button id="installDismiss" aria-label="Dismiss">✕</button>
      </div>

      <div id="result"></div>

      <div id="statusbar" class="statusbar" hidden>
        <span id="updatedAt"></span>
        <button id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div id="scrim" class="scrim"></div>
    <div id="settingsSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
      <div class="handle"></div>
      <h3 id="settingsTitle">Units &amp; display</h3>
      <div class="opt-row">
        <span id="lbl-temp">Temperature</span>
        <div class="seg" role="group" aria-labelledby="lbl-temp" data-unit="temp">
          <button data-value="c" aria-pressed="false">°C</button>
          <button data-value="f" aria-pressed="false">°F</button>
        </div>
      </div>
      <div class="opt-row">
        <span id="lbl-wind">Wind</span>
        <div class="seg" role="group" aria-labelledby="lbl-wind" data-unit="wind">
          <button data-value="kmh" aria-pressed="false">km/h</button>
          <button data-value="mph" aria-pressed="false">mph</button>
          <button data-value="ms" aria-pressed="false">m/s</button>
        </div>
      </div>
      <div class="opt-row">
        <span id="lbl-precip">Precipitation</span>
        <div class="seg" role="group" aria-labelledby="lbl-precip" data-unit="precip">
          <button data-value="mm" aria-pressed="false">mm</button>
          <button data-value="in" aria-pressed="false">in</button>
        </div>
      </div>
      <div class="opt-row">
        <span id="lbl-tone">Summary tone</span>
        <div class="seg" role="group" aria-labelledby="lbl-tone" data-setting="tone">
          <button data-value="plain" aria-pressed="false">Plain</button>
          <button data-value="brief" aria-pressed="false">Brief</button>
          <button data-value="blunt" aria-pressed="false">Blunt</button>
        </div>
      </div>
      <div class="opt-row">
        <span id="lbl-clock">Clock</span>
        <div class="seg" role="group" aria-labelledby="lbl-clock" data-unit="clock">
          <button data-value="24" aria-pressed="false">24-hour</button>
          <button data-value="12" aria-pressed="false">12-hour</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      // ---------- constants & helpers ----------

      const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
      const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";
      const AIR_URL = "https://air-quality-api.open-meteo.com/v1/air-quality";

      // WMO weather interpretation codes -> [icon, description]
      const WMO = {
        0: ["☀️", "Clear sky"],
        1: ["🌤️", "Mostly clear"],
        2: ["⛅", "Partly cloudy"],
        3: ["☁️", "Overcast"],
        45: ["🌫️", "Fog"],
        48: ["🌫️", "Rime fog"],
        51: ["🌦️", "Light drizzle"],
        53: ["🌦️", "Drizzle"],
        55: ["🌧️", "Heavy drizzle"],
        56: ["🌧️", "Freezing drizzle"],
        57: ["🌧️", "Freezing drizzle"],
        61: ["🌦️", "Light rain"],
        63: ["🌧️", "Rain"],
        65: ["🌧️", "Heavy rain"],
        66: ["🌧️", "Freezing rain"],
        67: ["🌧️", "Freezing rain"],
        71: ["🌨️", "Light snow"],
        73: ["🌨️", "Snow"],
        75: ["❄️", "Heavy snow"],
        77: ["🌨️", "Snow grains"],
        80: ["🌦️", "Light showers"],
        81: ["🌧️", "Showers"],
        82: ["⛈️", "Heavy showers"],
        85: ["🌨️", "Snow showers"],
        86: ["🌨️", "Snow showers"],
        95: ["⛈️", "Thunderstorm"],
        96: ["⛈️", "Thunderstorm, hail"],
        99: ["⛈️", "Thunderstorm, hail"],
      };

      function wmo(code) {
        return WMO[code] || ["🌡️", "—"];
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // ---------- units ----------

      // Forecasts are always fetched in metric and converted here, so every
      // threshold in the summary and wear advice stays in one unit system.
      const UNIT_DEFAULTS = { temp: "c", wind: "kmh", precip: "mm", clock: "24" };
      const units = { ...UNIT_DEFAULTS };
      try {
        const saved = JSON.parse(localStorage.getItem("wx-units")) || {};
        for (const k in UNIT_DEFAULTS)
          if (typeof saved[k] === "string") units[k] = saved[k];
      } catch {}

      function saveUnits() {
        localStorage.setItem("wx-units", JSON.stringify(units));
      }

      // Temperature: value in °C -> display number.
      function cTemp(v) {
        return units.temp === "f" ? v * 1.8 + 32 : v;
      }

      function tempSuffix() {
        return units.temp === "f" ? "°F" : "°C";
      }

      // Formatted temperature with degree sign; unit suffix optional.
      function fTemp(v, withUnit) {
        return `${Math.round(cTemp(v))}${withUnit ? tempSuffix() : "°"}`;
      }

      // A temperature *difference* scales but never shifts — 5°C apart is
      // 9°F apart, not 41.
      function fDelta(v) {
        return `${Math.round(units.temp === "f" ? v * 1.8 : v)}°`;
      }

      function cWind(v) {
        if (units.wind === "mph") return v / 1.609344;
        if (units.wind === "ms") return v / 3.6;
        return v;
      }

      function windSuffix() {
        return units.wind === "mph" ? "mph" : units.wind === "ms" ? "m/s" : "km/h";
      }

      function fWind(v, withUnit) {
        const n = cWind(v);
        const s = units.wind === "ms" ? n.toFixed(1) : String(Math.round(n));
        return withUnit ? `${s} ${windSuffix()}` : s;
      }

      function precipSuffix() {
        return units.precip === "in" ? "in" : "mm";
      }

      function fPrecip(v, withUnit) {
        const n = units.precip === "in" ? v / 25.4 : v;
        const s = units.precip === "in" ? n.toFixed(2) : String(v);
        return withUnit ? `${s} ${precipSuffix()}` : s;
      }

      // API times are ISO strings in the *location's* timezone (timezone=auto).
      // Never round-trip them through Date for clock labels — read the string.
      function clockLabel(iso) {
        const hhmm = iso.slice(11, 16);
        if (units.clock !== "12") return hhmm;
        const h = +hhmm.slice(0, 2);
        const m = hhmm.slice(3);
        const ampm = h < 12 ? "am" : "pm";
        const h12 = h % 12 === 0 ? 12 : h % 12;
        return m === "00" ? `${h12}${ampm}` : `${h12}:${m}${ampm}`;
      }

      function dayLabel(dateStr, index) {
        if (index === 0) return "Today";
        const d = new Date(dateStr + "T12:00");
        return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" });
      }

      function debounce(fn, ms) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), ms);
        };
      }

      function placeLabel(p) {
        return [p.name, p.admin1, p.country].filter(Boolean).join(", ");
      }

      // ---------- storage ----------

      function getRecents() {
        try {
          return JSON.parse(localStorage.getItem("wx-recents")) || [];
        } catch {
          return [];
        }
      }

      function addRecent(place) {
        if (!place.name || place.name === "My location") return;
        const rest = getRecents().filter(
          (r) => placeLabel(r) !== placeLabel(place),
        );
        localStorage.setItem(
          "wx-recents",
          JSON.stringify([place, ...rest].slice(0, 5)),
        );
        renderRecents();
      }

      function getLastPlace() {
        try {
          return JSON.parse(localStorage.getItem("wx-last"));
        } catch {
          return null;
        }
      }

      // ---------- data ----------

      async function geocode(query, count) {
        const res = await fetch(
          `${GEO_URL}?name=${encodeURIComponent(query)}&count=${count}`,
        );
        if (!res.ok) throw new Error("Geocoding failed");
        const data = await res.json();
        return data.results || [];
      }

      async function fetchForecast(lat, lon) {
        const url =
          `${FORECAST_URL}?latitude=${lat}&longitude=${lon}` +
          `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,cloud_cover,wind_speed_10m,precipitation` +
          `&minutely_15=precipitation,precipitation_probability` +
          `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,cloud_cover` +
          `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,uv_index_max,sunrise,sunset` +
          `&forecast_days=7&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Weather request failed");
        return res.json();
      }

      // Independent runs of the same day. Where they disagree, the headline
      // forecast is a coin flip and saying so beats projecting false certainty.
      const MODELS = [
        ["ecmwf_ifs025", "ECMWF"],
        ["gfs_seamless", "GFS"],
        ["icon_seamless", "ICON"],
        ["gem_seamless", "GEM"],
      ];

      async function fetchAgreement(lat, lon) {
        const url =
          `${FORECAST_URL}?latitude=${lat}&longitude=${lon}` +
          `&daily=precipitation_sum,temperature_2m_max` +
          `&models=${MODELS.map((m) => m[0]).join(",")}` +
          `&forecast_days=1&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Model comparison failed");
        return res.json();
      }

      // Yesterday and last week in one small request: the deltas people
      // actually reason in ("warmer than yesterday"), which an absolute
      // temperature never conveys on its own.
      async function fetchHistory(lat, lon) {
        const url =
          `${FORECAST_URL}?latitude=${lat}&longitude=${lon}` +
          `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset` +
          `&past_days=7&forecast_days=1&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("History request failed");
        return res.json();
      }

      const POLLENS = [
        ["alder_pollen", "Alder"],
        ["birch_pollen", "Birch"],
        ["grass_pollen", "Grass"],
        ["mugwort_pollen", "Mugwort"],
        ["olive_pollen", "Olive"],
        ["ragweed_pollen", "Ragweed"],
      ];

      async function fetchAir(lat, lon) {
        const url =
          `${AIR_URL}?latitude=${lat}&longitude=${lon}` +
          `&current=european_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,` +
          POLLENS.map((p) => p[0]).join(",") +
          `&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Air quality request failed");
        return res.json();
      }

      // ---------- rendering ----------

      const resultEl = document.getElementById("result");
      const WINDOW = 24; // hours shown in the chart and detail table
      let wxData = null; // last forecast response
      let windowStart = 0; // hourly index where the visible window starts
      let hoverHours = []; // data behind the chart hover layer

      // Chart series: chips act as both legend and toggles.
      const SERIES = {
        temp: { label: "Temperature", varName: "--temp", on: true },
        feels: { label: "Feels like", varName: "--feels", on: false },
        rain: { label: "Rain chance", varName: "--rain", on: true },
        clouds: { label: "Clouds", varName: "--clouds", on: false },
        humid: { label: "Humidity", varName: "--humid", on: false },
        wind: { label: "Wind", varName: "--wind", on: false },
      };
      try {
        const saved = JSON.parse(localStorage.getItem("wx-series")) || {};
        for (const k in SERIES)
          if (typeof saved[k] === "boolean") SERIES[k].on = saved[k];
      } catch {}

      function saveSeries() {
        const s = {};
        for (const k in SERIES) s[k] = SERIES[k].on;
        localStorage.setItem("wx-series", JSON.stringify(s));
      }

      // Narrow containers get a smaller viewBox so SVG text stays legible.
      function isCompact() {
        const el = document.getElementById("chartWrap");
        return (el ? el.clientWidth : innerWidth) < 480;
      }
      let compactState = null; // bucket the charts were last rendered for

      function renderCurrent(place, w) {
        const c = w.current;
        const [icon, cond] = wmo(c.weather_code);
        return `
          <div class="card">
            <div class="place-row">
              <h2>${escapeHtml(place.name)}</h2>
              <span class="small">${[
                escapeHtml(
                  [place.admin1, place.country].filter(Boolean).join(", "),
                ),
                `Local time ${timeTag(c.time)}`,
              ]
                .filter(Boolean)
                .join(" · ")}</span>
            </div>
            <div class="now">
              <div class="icon">${icon}</div>
              <div class="temp">${fTemp(c.temperature_2m, true)}</div>
              <div class="cond">
                ${escapeHtml(cond)}<br />
                <span class="feels">Feels like ${fTemp(c.apparent_temperature, true)}</span>
              </div>
            </div>
            <div class="metrics">
              <div class="metric"><b>${fWind(c.wind_speed_10m, true)}</b><span>Wind</span></div>
              <div class="metric"><b>${c.relative_humidity_2m}%</b><span>Humidity</span></div>
              <div class="metric"><b>${c.cloud_cover}%</b><span>Cloud cover</span></div>
              <div class="metric"><b>${fPrecip(c.precipitation, true)}</b><span>Precipitation</span></div>
            </div>
            <div class="sun-row">
              <span title="Sunrise" aria-label="Sunrise ${clockLabel(w.daily.sunrise[0])}">🌅 ${clockLabel(w.daily.sunrise[0])}</span>
              <span title="Sunset" aria-label="Sunset ${clockLabel(w.daily.sunset[0])}">🌇 ${clockLabel(w.daily.sunset[0])}</span>
            </div>
          </div>`;
      }

      // ---------- today's summary ----------

      // Hourly indices belonging to one calendar date (location time).
      function dayIndices(w, dateStr) {
        const out = [];
        const t = w.hourly.time;
        for (let i = 0; i < t.length; i++)
          if (t[i].slice(0, 10) === dateStr) out.push(i);
        return out;
      }

      // Rain hours are reported as contiguous runs so the text stays readable.
      function rainRuns(w, idx, minProb) {
        const runs = [];
        let start = -1;
        for (const i of idx) {
          const wet = (w.hourly.precipitation_probability[i] ?? 0) >= minProb;
          if (wet && start < 0) start = i;
          if (!wet && start >= 0) {
            runs.push([start, i]);
            start = -1;
          }
        }
        if (start >= 0) runs.push([start, idx[idx.length - 1] + 1]);
        return runs;
      }

      function dayStats(w) {
        const d = w.daily;
        const date = d.time[0];
        const idx = dayIndices(w, date);
        const now = currentHourIndex(w);
        const rest = idx.filter((i) => i >= now);
        const h = w.hourly;
        const pick = rest.length ? rest : idx;
        let warmest = pick[0];
        for (const i of pick)
          if (h.temperature_2m[i] > h.temperature_2m[warmest]) warmest = i;
        const windMax = idx.reduce(
          (m, i) => Math.max(m, h.wind_speed_10m[i] ?? 0),
          0,
        );
        return {
          date,
          idx,
          rest,
          hi: d.temperature_2m_max[0],
          lo: d.temperature_2m_min[0],
          feelsHi: d.apparent_temperature_max[0],
          feelsLo: d.apparent_temperature_min[0],
          code: d.weather_code[0],
          prob: d.precipitation_probability_max[0] ?? 0,
          sum: d.precipitation_sum[0] ?? 0,
          wind: d.wind_speed_10m_max?.[0] ?? windMax,
          uv: d.uv_index_max?.[0],
          warmestHour: h.time[warmest],
          rain: rainRuns(w, rest.length ? rest : idx, 40),
        };
      }

      const SNOW_CODES = [71, 73, 75, 77, 85, 86];

      function precipWord(code) {
        if (SNOW_CODES.includes(code)) return "Snow";
        if (code >= 95) return "Storms";
        return "Rain";
      }

      // Three voices over the same facts. Tone is a retention feature, not a
      // data feature: the numbers never change, only how blunt the sentence is.
      const TONES = { plain: "Plain", brief: "Brief", blunt: "Blunt" };
      let tone = localStorage.getItem("wx-tone") || "plain";
      if (!TONES[tone]) tone = "plain";

      function rainWindows(w, st) {
        return st.rain
          .slice(0, 2)
          .map(
            ([a, b]) =>
              `${clockLabel(w.hourly.time[a])}–${clockLabel(w.hourly.time[b] ?? w.hourly.time[b - 1])}`,
          )
          .join(" and ");
      }

      function summaryText(w, st) {
        const condRaw = wmo(st.code)[1];
        const cond = condRaw === "—" ? "Mixed conditions" : condRaw;
        const word = precipWord(st.code).toLowerCase();
        const windows = st.rain.length ? rainWindows(w, st) : "";

        if (tone === "brief") {
          const bits = [
            cond,
            `${fTemp(st.lo)}–${fTemp(st.hi, true)}`,
            windows
              ? `${word} ${windows}`
              : st.prob >= 20
                ? `${st.prob}% ${word}`
                : "dry",
          ];
          if (st.wind >= 25) bits.push(`wind ${fWind(st.wind, true)}`);
          if (st.uv >= 6) bits.push(`UV ${Math.round(st.uv)}`);
          bits.push(`sunset ${clockLabel(w.daily.sunset[0])}`);
          return bits.join(" · ");
        }

        if (tone === "blunt") {
          const out = [];
          if (windows) out.push(`${word[0].toUpperCase()}${word.slice(1)} ${windows}. Plan around it.`);
          else if (st.prob >= 30) out.push(`Might catch a shower, ${st.prob}% at worst.`);
          else out.push("Staying dry.");
          out.push(
            st.feelsHi <= 8
              ? `Cold — ${fTemp(st.feelsHi, true)} at best.`
              : st.feelsHi >= 28
                ? `Hot — feels ${fTemp(st.feelsHi, true)}.`
                : `Tops out at ${fTemp(st.hi, true)}, down to ${fTemp(st.lo)} overnight.`,
          );
          if (st.wind >= 45) out.push("Wind will be a problem.");
          if (st.uv >= 8) out.push("Sun will burn you.");
          out.push(`Dark by ${clockLabel(w.daily.sunset[0])}.`);
          return out.join(" ");
        }

        const parts = [];
        parts.push(
          `${cond.charAt(0).toUpperCase() + cond.slice(1).toLowerCase()} today, ` +
            `${fTemp(st.lo)} to ${fTemp(st.hi, true)}, warmest around ${clockLabel(st.warmestHour)}.`,
        );

        if (Math.round(cTemp(st.feelsHi)) !== Math.round(cTemp(st.hi)))
          parts.push(`Feels closer to ${fTemp(st.feelsHi)} at its peak.`);

        if (windows)
          parts.push(
            `${precipWord(st.code)} most likely ${windows} (${st.prob}% peak, ${fPrecip(st.sum, true)} total).`,
          );
        else if (st.prob >= 20)
          parts.push(`Showers possible but unlikely (${st.prob}% peak).`);
        else parts.push("Little to no rain expected.");

        if (st.wind >= 45) parts.push(`Strong wind, gusting to ${fWind(st.wind, true)}.`);
        else if (st.wind >= 25) parts.push(`Breezy, up to ${fWind(st.wind, true)}.`);

        if (st.uv >= 8) parts.push(`UV index peaks very high at ${Math.round(st.uv)}.`);
        else if (st.uv >= 6) parts.push(`UV index peaks high at ${Math.round(st.uv)}.`);

        parts.push(`Sun sets ${clockLabel(w.daily.sunset[0])}.`);
        return parts.join(" ");
      }

      // Advice keys off apparent temperature: what the day feels like beats
      // what the thermometer reads.
      function wearAdvice(st) {
        const hi = st.feelsHi;
        const lo = st.feelsLo;
        const items = [];

        if (hi <= 0) items.push(["🧥", "Heavy winter coat"]);
        else if (hi <= 8) items.push(["🧥", "Warm coat"]);
        else if (hi <= 15) items.push(["🧥", "Light jacket"]);
        else if (hi <= 22) items.push(["👕", "Long sleeves"]);
        else items.push(["👕", "T-shirt"]);

        if (hi >= 24) items.push(["🩳", "Shorts weather"]);
        if (hi - lo >= 9 && hi > 12) items.push(["🧅", "Layers — big day swing"]);
        if (lo <= 3) items.push(["🧤", "Gloves and hat"]);
        else if (lo <= 9 && hi >= 16) items.push(["🧣", "Something for the evening"]);

        const snowing = SNOW_CODES.includes(st.code);
        if (snowing) items.push(["❄️", "Snow-ready outer layer"]);
        else if (st.prob >= 60 || st.sum >= 3) items.push(["☔", "Umbrella"]);
        else if (st.prob >= 30) items.push(["🧢", "Rain shell, just in case"]);
        if (st.sum >= 8 || snowing) items.push(["🥾", "Waterproof shoes"]);

        if (st.wind >= 45) items.push(["🌬️", "Windproof outer layer"]);
        if (st.uv >= 6) items.push(["🕶️", "Sunglasses and sunscreen"]);
        if (snowing) items.push(["🦶", "Grip underfoot"]);

        return items;
      }

      // ---------- next two hours ----------

      const NOWCAST_STEPS = 8; // 8 x 15 min
      const WET_MM = 0.1;
      const WET_PROB = 50;

      // Returns null when there is nothing worth saying: a dry strip is noise.
      function nowcast(w) {
        const m = w.minutely_15;
        if (!m || !m.time) return null;
        const start = m.time.findIndex((t) => t >= w.current.time);
        if (start < 0) return null;
        const steps = [];
        for (let i = start; i < Math.min(start + NOWCAST_STEPS, m.time.length); i++)
          steps.push({
            time: m.time[i],
            mm: m.precipitation[i] ?? 0,
            prob: m.precipitation_probability?.[i] ?? 0,
          });
        if (steps.length < 2) return null;

        const wet = (s) => s.mm >= WET_MM || s.prob >= WET_PROB;
        if (!steps.some(wet)) return null;

        const word = precipWord(w.current.weather_code).toLowerCase();
        const first = steps.findIndex(wet);
        let text;
        if (first === 0) {
          // Already falling — the useful number is when it stops.
          const stop = steps.findIndex((s, i) => i > 0 && !wet(s));
          text =
            stop < 0
              ? `<b>${word[0].toUpperCase()}${word.slice(1)}</b> for at least the next 2 hours.`
              : `<b>${word[0].toUpperCase()}${word.slice(1)} easing around ${clockLabel(steps[stop].time)}</b>.`;
        } else {
          text = `<b>${word[0].toUpperCase()}${word.slice(1)} starting around ${clockLabel(steps[first].time)}</b> — about ${first * 15} min from now.`;
        }

        return { steps, text };
      }

      function renderNowcast(w) {
        const nc = nowcast(w);
        if (!nc) return "";
        const peak = Math.max(0.4, ...nc.steps.map((s) => s.mm));
        const bars = nc.steps
          .map((s) => {
            const h = Math.round((Math.min(s.mm, peak) / peak) * 100);
            const dry = s.mm < WET_MM;
            return `<i class="${dry ? "dry" : ""}" style="height:${dry ? 4 : Math.max(8, h)}%"
                      data-time="${clockLabel(s.time)}" data-mm="${s.mm}"
                      data-prob="${s.prob}"></i>`;
          })
          .join("");
        return `
          <div class="card">
            <div class="nowcast">
              <div class="nc-text">${nc.text}</div>
              <div class="nc-bars" role="img"
                aria-label="Precipitation over the next two hours">${bars}</div>
              <div class="nc-axis">
                <span>${clockLabel(nc.steps[0].time)}</span>
                <span>${clockLabel(nc.steps[nc.steps.length - 1].time)}</span>
              </div>
              <div class="tooltip" id="ncTip"></div>
            </div>
          </div>`;
      }

      // ---------- air quality & pollen ----------

      // European AQI bands, as published: the number alone means nothing to
      // most people, the word does.
      function aqiBand(v) {
        if (v == null) return null;
        if (v <= 20) return ["Good", "good"];
        if (v <= 40) return ["Fair", "fair"];
        if (v <= 60) return ["Moderate", "moderate"];
        if (v <= 80) return ["Poor", "poor"];
        if (v <= 100) return ["Very poor", "poor"];
        return ["Extremely poor", "severe"];
      }

      function pollenBand(v) {
        if (v == null || v < 1) return null;
        if (v < 10) return "low";
        if (v < 50) return "moderate";
        return "high";
      }

      function renderAir(air) {
        const c = air?.current;
        if (!c) return "";
        const aqi = c.european_aqi;
        const band = aqiBand(aqi);
        const pollens = POLLENS.map(([key, label]) => [label, pollenBand(c[key])])
          .filter(([, b]) => b);

        // Clean air with nothing in the air to react to is not news.
        if ((!band || aqi <= 40) && !pollens.length) return "";

        const worst = [
          ["PM2.5", c.pm2_5],
          ["PM10", c.pm10],
          ["Ozone", c.ozone],
          ["NO₂", c.nitrogen_dioxide],
        ]
          .filter(([, v]) => v != null)
          .sort((a, b) => b[1] - a[1])[0];

        const chips = pollens
          .map(
            ([label, b]) =>
              `<span class="pollen ${b}">${label} pollen ${b}</span>`,
          )
          .join("");

        return `
          <div class="card">
            <h3>Air quality</h3>
            ${
              band
                ? `<div class="aqi-row">
                     <span class="aqi ${band[1]}">${Math.round(aqi)}</span>
                     <div>
                       <b>${band[0]}</b>
                       ${worst ? `<div class="small">Highest reading: ${escapeHtml(worst[0])} at ${Math.round(worst[1])} µg/m³</div>` : ""}
                     </div>
                   </div>`
                : ""
            }
            ${chips ? `<div class="pollen-row">${chips}</div>` : ""}
          </div>`;
      }

      let lastAir = null;

      async function loadAir(place) {
        try {
          lastAir = await fetchAir(place.latitude, place.longitude);
          const host = document.getElementById("airSlot");
          if (host) host.innerHTML = renderAir(lastAir);
        } catch {
          /* air quality is a bonus, not a requirement */
        }
      }

      // ---------- accuracy scorecard ----------

      // Every load records what today's forecast claimed. Tomorrow's history
      // request grades it. Nobody else shows this because nobody else wants to
      // be graded — which is exactly why it earns trust.
      const LOG_KEY = "wx-forecast-log";
      const LOG_DAYS = 14;

      function placeKey(p) {
        return `${(+p.latitude).toFixed(2)},${(+p.longitude).toFixed(2)}`;
      }

      function readLog() {
        try {
          return JSON.parse(localStorage.getItem(LOG_KEY)) || {};
        } catch {
          return {};
        }
      }

      function logForecast(place, w, st) {
        const log = readLog();
        const cutoff = new Date(Date.now() - LOG_DAYS * 86400000)
          .toISOString()
          .slice(0, 10);
        for (const k of Object.keys(log))
          if ((log[k].date || "") < cutoff) delete log[k];
        log[`${placeKey(place)}|${st.date}`] = {
          date: st.date,
          hi: st.hi,
          lo: st.lo,
          prob: st.prob,
          rain: st.sum >= 0.5 || st.prob >= 50,
        };
        try {
          localStorage.setItem(LOG_KEY, JSON.stringify(log));
        } catch {
          /* private mode, or storage full — grading is optional */
        }
      }

      // Grades every logged day this history response can settle.
      function gradeForecasts(place, hist) {
        const d = hist.daily;
        if (!d?.time) return null;
        const log = readLog();
        const today = d.time[d.time.length - 1];
        const graded = [];
        for (let i = 0; i < d.time.length; i++) {
          const date = d.time[i];
          if (date >= today) continue; // today isn't over yet
          const entry = log[`${placeKey(place)}|${date}`];
          if (!entry) continue;
          const actualHi = d.temperature_2m_max[i];
          const actualRain = (d.precipitation_sum[i] ?? 0) >= 0.5;
          if (actualHi == null) continue;
          graded.push({
            date,
            saidHi: entry.hi,
            actualHi,
            err: Math.abs(actualHi - entry.hi),
            saidRain: entry.rain,
            prob: entry.prob ?? 0,
            actualRain,
            rainRight: entry.rain === actualRain,
          });
        }
        return graded.length ? graded : null;
      }

      // A 40% call that stayed dry was not a wrong forecast, so it is not
      // reported as a miss.
      function rainVerdict(g) {
        if (g.rainRight) return "rain called right";
        if (g.saidRain && !g.actualRain)
          return g.prob < 60
            ? `rain was a ${g.prob}% call and it stayed dry`
            : "we called rain and it stayed dry";
        return "rain arrived that we did not call";
      }

      function scoreText(graded) {
        const last = graded[graded.length - 1];
        const yesterday = new Date(Date.now() - 86400000)
          .toISOString()
          .slice(0, 10);
        const when =
          last.date === yesterday
            ? "Yesterday"
            : new Date(last.date + "T12:00").toLocaleDateString(undefined, {
                weekday: "long",
              });
        const lines = [
          `${when} we said ${fTemp(last.saidHi)}, it reached ${fTemp(last.actualHi, true)} — ${rainVerdict(last)}.`,
        ];
        if (graded.length >= 3) {
          const avg =
            graded.reduce((a, g) => a + g.err, 0) / graded.length;
          const right = graded.filter((g) => g.rainRight).length;
          lines.push(
            `Last ${graded.length} days: highs within ${fDelta(avg)} on average, rain right ${right} of ${graded.length}.`,
          );
        }
        return lines.join(" ");
      }

      function renderScore(place, hist) {
        const el = document.getElementById("scorecard");
        if (!el || !place || !hist) return;
        const graded = gradeForecasts(place, hist);
        if (!graded) return;
        el.textContent = scoreText(graded);
        el.hidden = false;
      }

      // ---------- yesterday and daylight ----------

      // Clock arithmetic on the strings, never through Date: these are local
      // times at the *location*, and a Date would read them in the browser's
      // zone and its DST rules.
      function minutesBetween(aIso, bIso) {
        const mins = (iso) => +iso.slice(11, 13) * 60 + +iso.slice(14, 16);
        return mins(bIso) - mins(aIso);
      }

      function humanDuration(mins) {
        const m = Math.abs(Math.round(mins));
        const h = Math.floor(m / 60);
        return h ? `${h}h ${m % 60}m` : `${m} min`;
      }

      function contextLine(hist) {
        const d = hist.daily;
        const last = d.time.length - 1; // today
        const yest = last - 1;
        const weekAgo = 0;
        if (yest < 0) return "";
        const bits = [];

        const dMax = d.temperature_2m_max[last] - d.temperature_2m_max[yest];
        if (Math.abs(dMax) >= 1)
          bits.push(
            `${fDelta(Math.abs(dMax))} ${dMax > 0 ? "warmer" : "colder"} than yesterday`,
          );
        else bits.push("About the same as yesterday");

        if (d.sunrise?.[weekAgo] && d.sunset?.[last]) {
          const today = minutesBetween(d.sunrise[last], d.sunset[last]);
          const then = minutesBetween(d.sunrise[weekAgo], d.sunset[weekAgo]);
          const diff = today - then;
          if (Math.abs(diff) >= 3)
            bits.push(
              `${humanDuration(diff)} ${diff > 0 ? "more" : "less"} daylight than a week ago`,
            );
        }
        return bits.join(" · ");
      }

      function renderContext(hist) {
        const el = document.getElementById("dayContext");
        if (!el || !hist) return;
        const text = contextLine(hist);
        if (!text) return;
        el.textContent = text + ".";
        el.hidden = false;
      }

      let lastHistory = null; // kept so a re-render can restore the line
      let lastHistoryPlace = null;

      async function loadHistory(place) {
        lastHistoryPlace = place;
        try {
          const data = await fetchHistory(place.latitude, place.longitude);
          lastHistory = data;
          renderContext(data);
          renderScore(place, data);
        } catch {
          /* context is a bonus, not a requirement */
        }
      }

      // How many models call today's rain the same way the headline does.
      function agreementFrom(data, headlineWet) {
        const runs = [];
        for (const [key, label] of MODELS) {
          const sum = data.daily?.[`precipitation_sum_${key}`]?.[0];
          const max = data.daily?.[`temperature_2m_max_${key}`]?.[0];
          if (sum == null && max == null) continue;
          runs.push({ label, wet: (sum ?? 0) >= 0.5, max });
        }
        if (runs.length < 2) return null;
        const agree = runs.filter((r) => r.wet === headlineWet).length;
        const temps = runs.map((r) => r.max).filter((v) => v != null);
        const spread = temps.length
          ? Math.max(...temps) - Math.min(...temps)
          : 0;
        return { agree, total: runs.length, spread };
      }

      function renderAgreement(a, headlineWet) {
        const el = document.getElementById("agreement");
        if (!el || !a) return;
        const dots = Array.from(
          { length: a.total },
          (_, i) => `<i class="${i < a.agree ? "on" : ""}"></i>`,
        ).join("");
        const call = headlineWet ? "rain" : "a dry day";
        let text = `${a.agree} of ${a.total} models agree on ${call}`;
        if (a.agree === a.total) text += " — high confidence";
        else if (a.agree * 2 <= a.total) text += " — treat today as uncertain";
        if (a.spread >= 4)
          text += `, and they differ by ${fDelta(a.spread)} on the high`;
        el.innerHTML = `<span class="agree-dots" aria-hidden="true">${dots}</span><span>${escapeHtml(text)}.</span>`;
        el.hidden = false;
      }

      // Fired after the page has already rendered: a slow or failed comparison
      // must never hold up the forecast itself.
      async function loadAgreement(place, headlineWet) {
        try {
          const data = await fetchAgreement(place.latitude, place.longitude);
          lastAgreement = { data, headlineWet };
          renderAgreement(agreementFrom(data, headlineWet), headlineWet);
        } catch {
          /* comparison is a bonus, not a requirement */
        }
      }

      let lastAgreement = null; // kept so a re-render can restore the line

      // Comfort score per hour, lower is better. Rain dominates, then how far
      // the apparent temperature sits from a mild 15–23°, then wind.
      function hourPenalty(w, i) {
        const h = w.hourly;
        const feels = h.apparent_temperature[i];
        const prob = h.precipitation_probability[i] ?? 0;
        const mm = h.precipitation[i] ?? 0;
        let p = prob * 0.6 + mm * 25;
        if (feels < 15) p += (15 - feels) * 3;
        else if (feels > 23) p += (feels - 23) * 4;
        p += Math.max(0, (h.wind_speed_10m[i] ?? 0) - 20) * 1.5;
        return p;
      }

      // Best and worst three-hour stretches of remaining daylight today.
      function outdoorWindows(w, st) {
        const sunrise = w.daily.sunrise[0];
        const sunset = w.daily.sunset[0];
        const day = st.idx.filter(
          (i) =>
            w.hourly.time[i] >= sunrise &&
            w.hourly.time[i] <= sunset &&
            w.hourly.time[i] >= w.current.time,
        );
        const RUN = 3;
        if (day.length < RUN + 1) return null;
        const runs = [];
        for (let k = 0; k + RUN <= day.length; k++) {
          const slice = day.slice(k, k + RUN);
          runs.push({
            start: slice[0],
            end: slice[RUN - 1],
            score: slice.reduce((a, i) => a + hourPenalty(w, i), 0) / RUN,
          });
        }
        runs.sort((a, b) => a.score - b.score);
        const best = runs[0];
        const worst = runs[runs.length - 1];
        // A flat day has no useful "best" — saying so would be noise.
        if (worst.score - best.score < 12) return null;
        return { best, worst };
      }

      function renderWindows(w, st) {
        const win = outdoorWindows(w, st);
        if (!win) return "";
        const span = (r) =>
          `${clockLabel(w.hourly.time[r.start])}–${clockLabel(
            w.hourly.time[r.end + 1] ?? w.hourly.time[r.end],
          )}`;
        const parts = [`<b>Best time out: ${span(win.best)}</b>`];
        if (win.worst.score > 45) parts.push(`worst ${span(win.worst)}`);
        return `<p class="windows">${parts.join(" · ")}</p>`;
      }

      function renderToday(w) {
        const st = dayStats(w);
        const items = wearAdvice(st)
          .map(
            ([icon, text]) =>
              `<span class="wear-item">${icon} ${escapeHtml(text)}</span>`,
          )
          .join("");
        return `
          <div class="card">
            <div class="today-top">
              <h3 style="margin:0">Today</h3>
              <div class="hilo">
                <span class="hilo-label">High / low</span>
                <span class="hi">${fTemp(st.hi)}</span>
                <span class="lo">/ ${fTemp(st.lo)}</span>
              </div>
            </div>
            <p class="day-summary">${escapeHtml(summaryText(w, st))}</p>
            ${renderWindows(w, st)}
            <p class="day-context" id="dayContext" hidden></p>
            <p class="scorecard" id="scorecard" hidden></p>
            <div class="agreement" id="agreement" hidden></div>
            <div class="wear">
              <h4>Recommended wear</h4>
              <div class="wear-items">${items}</div>
            </div>
          </div>`;
      }

      // Hourly index of the hour containing "now" (location time).
      function currentHourIndex(w) {
        const i = w.hourly.time.findIndex((t) => t > w.current.time) - 1;
        return i < 0 ? 0 : i;
      }

      function hourAt(w, i) {
        const h = w.hourly;
        return {
          time: h.time[i],
          label: clockLabel(h.time[i]),
          temp: h.temperature_2m[i],
          feels: h.apparent_temperature[i],
          wind: h.wind_speed_10m[i],
          prob: h.precipitation_probability[i],
          precip: h.precipitation[i],
          clouds: h.cloud_cover[i],
          humid: h.relative_humidity_2m[i],
          code: h.weather_code[i],
        };
      }

      function windowHours(w, start) {
        const out = [];
        const end = Math.min(start + WINDOW, w.hourly.time.length);
        for (let i = start; i < end; i++) out.push(hourAt(w, i));
        return out;
      }

      // Stacked panels sharing one time axis, one per unit family (a
      // meteogram — never a dual-axis overlay). Panels appear only when a
      // series in them is toggled on.
      function renderChartSvg(hours) {
        const compact = isCompact();
        compactState = compact;
        const W = compact ? 400 : 760;
        const padL = compact ? 40 : 46;
        const padR = 14;
        const innerW = W - padL - padR;
        const step = innerW / hours.length;
        const cx = (i) => padL + step * (i + 0.5);

        const panels = {};
        let cursor = 14;
        function addPanel(key, height) {
          panels[key] = { top: cursor, bottom: cursor + height };
          cursor += height + 26;
        }
        if (SERIES.temp.on || SERIES.feels.on) addPanel("temp", 100);
        if (SERIES.rain.on || SERIES.clouds.on || SERIES.humid.on)
          addPanel("pct", 68);
        if (SERIES.wind.on) addPanel("wind", 56);

        if (!Object.keys(panels).length) {
          return '<p class="small">Turn on a series above to show the chart.</p>';
        }

        const lastBottom = cursor - 26;
        const labelY = lastBottom + 18;
        const H = labelY + 10;

        let s = "";

        const line = (vals, y, color) =>
          `<polyline points="${vals
            .map((v, i) => `${cx(i)},${y(v ?? 0)}`)
            .join(" ")}" fill="none" stroke="${color}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round" />`;

        if (panels.temp) {
          const p = panels.temp;
          const vals = [];
          if (SERIES.temp.on) vals.push(...hours.map((h) => h.temp));
          if (SERIES.feels.on) vals.push(...hours.map((h) => h.feels));
          const tMin = Math.floor(Math.min(...vals)) - 1;
          const tMax = Math.ceil(Math.max(...vals)) + 1;
          const ty = (v) =>
            p.bottom - ((v - tMin) / (tMax - tMin)) * (p.bottom - p.top);
          const mid = Math.round((tMin + tMax) / 2);
          for (const v of [tMin + 1, mid, tMax - 1]) {
            s += `<line x1="${padL}" y1="${ty(v)}" x2="${W - padR}" y2="${ty(v)}"
                    stroke="var(--grid)" stroke-width="1" />
                  <text x="${padL - 6}" y="${ty(v) + 4}" text-anchor="end"
                    font-size="11" fill="var(--muted)">${fTemp(v)}</text>`;
          }
          if (SERIES.feels.on)
            s += line(hours.map((h) => h.feels), ty, "var(--feels)");
          if (SERIES.temp.on) {
            const temps = hours.map((h) => h.temp);
            s += line(temps, ty, "var(--temp)");
            // direct labels on the extremes only
            const iMax = temps.indexOf(Math.max(...temps));
            const iMin = temps.indexOf(Math.min(...temps));
            for (const [i, dy] of [
              [iMax, -8],
              [iMin, 16],
            ]) {
              s += `<circle cx="${cx(i)}" cy="${ty(temps[i])}" r="4"
                      fill="var(--temp)" stroke="var(--surface)" stroke-width="2" />
                    <text x="${cx(i)}" y="${ty(temps[i]) + dy}" text-anchor="middle"
                      font-size="12" font-weight="600" fill="var(--text)">${fTemp(
                        temps[i],
                      )}</text>`;
            }
          }
        }

        if (panels.pct) {
          const p = panels.pct;
          const py = (v) => p.bottom - ((v ?? 0) / 100) * (p.bottom - p.top);
          for (const v of [50, 100]) {
            s += `<line x1="${padL}" y1="${py(v)}" x2="${W - padR}" y2="${py(v)}"
                    stroke="var(--grid)" stroke-width="1" />
                  <text x="${padL - 6}" y="${py(v) + 4}" text-anchor="end"
                    font-size="11" fill="var(--muted)">${v}%</text>`;
          }
          s += `<line x1="${padL}" y1="${p.bottom}" x2="${W - padR}" y2="${p.bottom}"
                  stroke="var(--baseline)" stroke-width="1" />`;
          const rainOnly =
            SERIES.rain.on && !SERIES.clouds.on && !SERIES.humid.on;
          const dry = hours.every(
            (h) => (h.prob ?? 0) <= 2 && !h.precip,
          );
          if (rainOnly && dry) {
            s += `<text x="${padL + innerW / 2}" y="${(p.top + p.bottom) / 2 + 4}"
                    text-anchor="middle" font-size="12"
                    fill="var(--muted)">No rain expected</text>`;
          } else if (SERIES.rain.on) {
            // rain-probability bars: thin, rounded data-end, square baseline
            const barW = Math.min(16, step - 4);
            for (let i = 0; i < hours.length; i++) {
              const prob = hours[i].prob ?? 0;
              if (prob <= 0) continue;
              const x = cx(i) - barW / 2;
              const yTop = py(prob);
              const r = Math.min(4, p.bottom - yTop);
              s += `<path d="M${x},${p.bottom} V${yTop + r}
                      Q${x},${yTop} ${x + r},${yTop}
                      H${x + barW - r}
                      Q${x + barW},${yTop} ${x + barW},${yTop + r}
                      V${p.bottom} Z" fill="var(--rain)" />`;
            }
          }
          if (SERIES.clouds.on)
            s += line(hours.map((h) => h.clouds), py, "var(--clouds)");
          if (SERIES.humid.on)
            s += line(hours.map((h) => h.humid), py, "var(--humid)");
        }

        if (panels.wind) {
          const p = panels.wind;
          const wMax = Math.max(
            10,
            Math.ceil(Math.max(...hours.map((h) => h.wind)) / 10) * 10,
          );
          const wy = (v) => p.bottom - (v / wMax) * (p.bottom - p.top);
          s += `<line x1="${padL}" y1="${p.top}" x2="${W - padR}" y2="${p.top}"
                  stroke="var(--grid)" stroke-width="1" />
                <text x="${padL - 6}" y="${p.top + 4}" text-anchor="end"
                  font-size="11" fill="var(--muted)">${fWind(wMax)}</text>
                <text x="${padL - 6}" y="${p.bottom + 2}" text-anchor="end"
                  font-size="10" fill="var(--muted)">${windSuffix()}</text>
                <line x1="${padL}" y1="${p.bottom}" x2="${W - padR}" y2="${p.bottom}"
                  stroke="var(--baseline)" stroke-width="1" />`;
          s += line(hours.map((h) => h.wind), wy, "var(--wind)");
        }

        // shared hour labels (sparser when compact)
        for (let i = 0; i < hours.length; i += compact ? 6 : 3) {
          s += `<text x="${cx(i)}" y="${labelY}" text-anchor="middle"
                  font-size="11" fill="var(--muted)">${hours[i].label}</text>`;
        }

        // crosshair (moved by the hover handler)
        s += `<line id="crosshair" x1="0" y1="14" x2="0" y2="${lastBottom}"
                stroke="var(--baseline)" stroke-width="1" visibility="hidden" />`;

        return `<svg id="hourlyChart" viewBox="0 0 ${W} ${H}"
                  data-padl="${padL}" data-padr="${padR}" data-w="${W}"
                  role="img" aria-label="Hourly forecast chart">${s}</svg>`;
      }

      function renderHourlyCard() {
        return `
          <div class="card">
            <h3>Hourly forecast</h3>
            <div class="series-chips" id="seriesChips"></div>
            <div class="chart-wrap" id="chartWrap"></div>
            <div class="overview" id="overviewWrap"></div>
            <details id="hourlyDetails"${
              localStorage.getItem("wx-details-open") === "1" ? " open" : ""
            }>
              <summary>Hourly details</summary>
              <div class="table-wrap" id="hourlyTable"></div>
            </details>
          </div>`;
      }

      function refreshChips() {
        document.getElementById("seriesChips").innerHTML = Object.entries(
          SERIES,
        )
          .map(
            ([k, sr]) => `
              <button class="schip${sr.on ? "" : " off"}" data-k="${k}"
                aria-pressed="${sr.on}">
                <span class="swatch" style="background:var(${sr.varName})"></span>${sr.label}
              </button>`,
          )
          .join("");
      }

      function refreshChart() {
        hoverHours = windowHours(wxData, windowStart);
        document.getElementById("chartWrap").innerHTML =
          renderChartSvg(hoverHours) +
          '<div class="tooltip" id="chartTip"></div>';
        attachChartHover();
      }

      function refreshTable() {
        const ni = currentHourIndex(wxData);
        const rows = hoverHours
          .map(
            (h, idx) => `
              <tr${
                windowStart + idx === ni
                  ? ' class="now-row" aria-current="time"'
                  : ""
              }>
                <td>${h.label}</td>
                <td>${wmo(h.code)[0]}</td>
                <td>${fTemp(h.temp, true)}</td>
                <td>${fTemp(h.feels, true)}</td>
                <td>${h.prob ?? "–"}%</td>
                <td>${fPrecip(h.precip, true)}</td>
                <td>${fWind(h.wind, true)}</td>
                <td>${h.clouds}%</td>
                <td>${h.humid}%</td>
              </tr>`,
          )
          .join("");
        document.getElementById("hourlyTable").innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Time</th><th></th><th>Temp</th><th>Feels</th>
                <th>Rain %</th><th>Rain ${precipSuffix()}</th><th>Wind</th>
                <th>Clouds</th><th>Humidity</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      // ---------- 7-day overview strip with a draggable 24h window ----------

      const OV = { W: 760, H: 70, padL: 8, padR: 8, top: 8, bottom: 48, labelY: 64 };

      function timeTag(iso) {
        const wd = new Date(iso.slice(0, 10) + "T12:00").toLocaleDateString(
          undefined,
          { weekday: "short" },
        );
        return `${wd} ${iso.slice(11, 16)}`;
      }

      function windowRectX() {
        const svg = document.getElementById("overviewSvg");
        const W = svg ? +svg.dataset.w : OV.W;
        const n = wxData.hourly.time.length;
        const x = (i) => OV.padL + (i / (n - 1)) * (W - OV.padL - OV.padR);
        return {
          x0: x(windowStart),
          x1: x(Math.min(windowStart + WINDOW, n - 1)),
        };
      }

      function renderOverviewSvg() {
        const W = isCompact() ? 400 : 760;
        const h = wxData.hourly;
        const n = h.time.length;
        const x = (i) => OV.padL + (i / (n - 1)) * (W - OV.padL - OV.padR);
        const temps = h.temperature_2m;
        const tMin = Math.min(...temps);
        const tMax = Math.max(...temps);
        const ty = (v) =>
          OV.bottom -
          ((v - tMin) / (tMax - tMin || 1)) * (OV.bottom - OV.top);
        const gripTop = (4 + OV.bottom) / 2 - 6;

        let s = `<line x1="${OV.padL}" y1="${OV.bottom}" x2="${W - OV.padR}"
                   y2="${OV.bottom}" stroke="var(--baseline)" stroke-width="1" />`;
        for (let i = 0; i < n; i++) {
          if (h.time[i].slice(11) !== "00:00") continue;
          s += `<line x1="${x(i)}" y1="${OV.top}" x2="${x(i)}" y2="${OV.bottom}"
                  stroke="var(--grid)" stroke-width="1" />`;
          if (i + 12 < n)
            s += `<text x="${x(i + 12)}" y="${OV.labelY}" text-anchor="middle"
                    font-size="11" fill="var(--muted)">${new Date(
                      h.time[i].slice(0, 10) + "T12:00",
                    ).toLocaleDateString(undefined, { weekday: "short" })}</text>`;
        }
        s += `<polyline points="${temps
          .map((v, i) => `${x(i)},${ty(v)}`)
          .join(" ")}" fill="none" stroke="var(--temp)" stroke-width="1.5"
            opacity="0.55" />`;
        const ni = currentHourIndex(wxData);
        s += `<line x1="${x(ni)}" y1="${OV.top}" x2="${x(ni)}" y2="${OV.bottom}"
                stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" />`;
        const { x0, x1 } = windowRectX0(W, n);
        s += `<rect id="winRect" x="${x0}" y="4" width="${x1 - x0}"
                height="${OV.bottom - 4}" rx="7" fill="var(--accent)"
                fill-opacity="0.12" stroke="var(--accent)" stroke-width="1.5" />`;
        // grip lines: the drag affordance on the window's edges
        for (const [id, gx] of [
          ["winGrip1", x0 + 5],
          ["winGrip2", x1 - 5],
        ]) {
          s += `<line id="${id}" x1="${gx}" y1="${gripTop}" x2="${gx}"
                  y2="${gripTop + 12}" stroke="var(--accent)" stroke-width="2"
                  stroke-linecap="round" opacity="0.7" />`;
        }
        return `<svg id="overviewSvg" viewBox="0 0 ${W} ${OV.H}" data-w="${W}"
                  tabindex="0" role="slider" aria-label="Forecast window, 7 day timeline"
                  aria-valuemin="0" aria-valuemax="${Math.max(0, n - WINDOW)}"
                  aria-valuenow="${windowStart}"
                  aria-valuetext="${rangeLabelText()}">${s}</svg>`;
      }

      // same math as windowRectX, usable before the svg exists in the DOM
      function windowRectX0(W, n) {
        const x = (i) => OV.padL + (i / (n - 1)) * (W - OV.padL - OV.padR);
        return {
          x0: x(windowStart),
          x1: x(Math.min(windowStart + WINDOW, n - 1)),
        };
      }

      function rangeLabelText() {
        const t = wxData.hourly.time;
        const end = Math.min(windowStart + WINDOW, t.length) - 1;
        return `${timeTag(t[windowStart])} – ${timeTag(t[end])}`;
      }

      function updateOverviewWindow() {
        const rect = document.getElementById("winRect");
        if (rect) {
          const { x0, x1 } = windowRectX();
          rect.setAttribute("x", x0);
          rect.setAttribute("width", x1 - x0);
          for (const [id, gx] of [
            ["winGrip1", x0 + 5],
            ["winGrip2", x1 - 5],
          ]) {
            const g = document.getElementById(id);
            if (g) {
              g.setAttribute("x1", gx);
              g.setAttribute("x2", gx);
            }
          }
        }
        const svg = document.getElementById("overviewSvg");
        if (svg) {
          svg.setAttribute("aria-valuenow", windowStart);
          svg.setAttribute("aria-valuetext", rangeLabelText());
        }
        const lbl = document.getElementById("rangeLabel");
        if (lbl) lbl.textContent = rangeLabelText();
        const nowBtn = document.getElementById("nowBtn");
        if (nowBtn)
          nowBtn.style.visibility =
            windowStart === currentHourIndex(wxData) ? "hidden" : "visible";
      }

      function setWindowStart(v) {
        const maxStart = Math.max(0, wxData.hourly.time.length - WINDOW);
        const next = Math.max(0, Math.min(maxStart, Math.round(v)));
        if (next === windowStart) return;
        windowStart = next;
        refreshChart();
        refreshTable();
        updateOverviewWindow();
      }

      function attachOverviewDrag() {
        const svg = document.getElementById("overviewSvg");
        if (!svg) return;
        const n = wxData.hourly.time.length;
        let grabOffset = 0;
        const idxAt = (clientX) => {
          const r = svg.getBoundingClientRect();
          return ((clientX - r.left) / r.width) * (n - 1);
        };
        svg.addEventListener("pointerdown", (e) => {
          const i = idxAt(e.clientX);
          grabOffset =
            i >= windowStart && i <= windowStart + WINDOW
              ? i - windowStart
              : WINDOW / 2;
          setWindowStart(i - grabOffset);
          svg.setPointerCapture(e.pointerId);
          svg.classList.add("dragging");
          e.preventDefault();
        });
        svg.addEventListener("pointermove", (e) => {
          if (svg.classList.contains("dragging"))
            setWindowStart(idxAt(e.clientX) - grabOffset);
        });
        const stop = () => svg.classList.remove("dragging");
        svg.addEventListener("pointerup", stop);
        svg.addEventListener("pointercancel", stop);

        // The strip reads as a chart, so it has to answer like one. While a
        // drag is in progress the window rectangle is the feedback, not this.
        const wrap = document.getElementById("overviewWrap");
        const tip = document.getElementById("overviewTip");
        if (wrap && tip) {
          const hideTip = () => (tip.style.display = "none");
          svg.addEventListener("pointermove", (e) => {
            if (svg.classList.contains("dragging")) return hideTip();
            const i = Math.round(idxAt(e.clientX));
            if (i < 0 || i >= n) return hideTip();
            const h = hourAt(wxData, i);
            tip.innerHTML = `
              <div class="t-time">${dayLabel(h.time.slice(0, 10), -1)} ${h.label} · ${escapeHtml(wmo(h.code)[1])}</div>
              <div>${fTemp(h.temp, true)} · rain ${h.prob ?? "–"}% · wind ${fWind(h.wind, true)}</div>`;
            tip.style.display = "block";
            positionTip(wrap, tip, e.clientX, 4);
          });
          svg.addEventListener("pointerleave", hideTip);
          svg.addEventListener("pointerup", hideTip);
        }
        svg.addEventListener("keydown", (e) => {
          const stepH = e.shiftKey ? 24 : 3;
          if (e.key === "ArrowLeft") setWindowStart(windowStart - stepH);
          else if (e.key === "ArrowRight") setWindowStart(windowStart + stepH);
          else if (e.key === "Home") setWindowStart(currentHourIndex(wxData));
          else return;
          e.preventDefault();
        });
      }

      function refreshOverview() {
        document.getElementById("overviewWrap").innerHTML =
          renderOverviewSvg() +
          '<div class="tooltip" id="overviewTip"></div>' +
          `<div class="range-row">
             <span class="small" id="rangeLabel">${rangeLabelText()}</span>
             <span class="range-controls">
               <button class="icon-btn btn-sm" id="stepBack" aria-label="Back one day">◀</button>
               <button class="icon-btn btn-sm" id="nowBtn">Now</button>
               <button class="icon-btn btn-sm" id="stepFwd" aria-label="Forward one day">▶</button>
             </span>
           </div>`;
        attachOverviewDrag();
        document
          .getElementById("nowBtn")
          .addEventListener("click", () =>
            setWindowStart(currentHourIndex(wxData)),
          );
        document
          .getElementById("stepBack")
          .addEventListener("click", () => setWindowStart(windowStart - 24));
        document
          .getElementById("stepFwd")
          .addEventListener("click", () => setWindowStart(windowStart + 24));
        updateOverviewWindow();
      }

      function refreshHourly() {
        refreshChips();
        refreshChart();
        refreshOverview();
        refreshTable();
        document
          .getElementById("seriesChips")
          .addEventListener("click", (e) => {
            const chipEl = e.target.closest(".schip");
            if (!chipEl) return;
            const k = chipEl.dataset.k;
            SERIES[k].on = !SERIES[k].on;
            saveSeries();
            refreshChips();
