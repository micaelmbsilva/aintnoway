<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>

    <style>
      :root {
        color-scheme: light;
        --bg: #f9f9f7;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --baseline: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --temp: #eb6834;
        --rain: #2a78d6;
        --accent: #2a78d6;
        --accent-text: #ffffff;
        --chip: #f0efec;
        --error: #d03b3b;
        --feels: #1baf7a;
        --clouds: #eda100;
        --humid: #e87ba4;
        --wind: #008300;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0d0d0d;
          --surface: #1a1a19;
          --text: #ffffff;
          --text-2: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --baseline: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --temp: #d95926;
          --rain: #3987e5;
          --accent: #3987e5;
          --accent-text: #ffffff;
          --chip: #262624;
          --error: #e66767;
          --feels: #199e70;
          --clouds: #c98500;
          --humid: #d55181;
          --wind: #008300;
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d0d0d;
        --surface: #1a1a19;
        --text: #ffffff;
        --text-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --baseline: #383835;
        --border: rgba(255, 255, 255, 0.1);
        --temp: #d95926;
        --rain: #3987e5;
        --accent: #3987e5;
        --accent-text: #ffffff;
        --chip: #262624;
        --error: #e66767;
        --feels: #199e70;
        --clouds: #c98500;
        --humid: #d55181;
        --wind: #008300;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 24px 16px;
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .icon-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 16px;
        cursor: pointer;
        color: var(--text);
      }

      .btn-sm {
        padding: 4px 10px;
        font-size: 13px;
        border-radius: 8px;
      }

      .search {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        position: relative;
      }

      .search-box {
        flex: 1;
        position: relative;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
      }

      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      button.primary {
        padding: 13px 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        background: var(--accent);
        color: var(--accent-text);
      }

      .dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        z-index: 10;
        overflow: hidden;
        display: none;
      }

      .dropdown.open {
        display: block;
      }

      .dropdown-item {
        padding: 11px 14px;
        cursor: pointer;
        font-size: 15px;
      }

      .dropdown-item .sub {
        color: var(--muted);
        font-size: 13px;
      }

      .dropdown-item:hover,
      .dropdown-item.active {
        background: var(--chip);
      }

      .recents {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .chip {
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 14px;
        cursor: pointer;
        color: var(--text-2);
      }

      .chip:hover {
        color: var(--text);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        margin-bottom: 16px;
      }

      .card h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .place-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }

      .place-row h2 {
        margin: 0;
        font-size: 22px;
      }

      .now {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }

      .now .icon {
        font-size: 52px;
        line-height: 1;
      }

      .now .temp {
        font-size: 48px;
        font-weight: 600;
      }

      .now .cond {
        color: var(--text-2);
        font-size: 16px;
      }

      .now .cond .feels {
        color: var(--muted);
        font-size: 14px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      .metric b {
        font-size: 18px;
        font-weight: 600;
        display: block;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
      }

      .small {
        color: var(--muted);
        font-size: 13px;
      }

      .today-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .hilo {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }

      .hilo .hi {
        font-size: 30px;
        font-weight: 600;
      }

      .hilo .lo {
        font-size: 22px;
        color: var(--muted);
      }

      .hilo .hilo-label {
        color: var(--muted);
        font-size: 13px;
      }

      .day-summary {
        margin: 12px 0 0;
        color: var(--text-2);
        font-size: 15px;
        line-height: 1.55;
      }

      .wear {
        margin-top: 14px;
        border-top: 1px solid var(--grid);
        padding-top: 12px;
      }

      .wear h4 {
        margin: 0 0 9px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }

      .wear-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .wear-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text-2);
        font-size: 13px;
      }

      @media (max-width: 520px) {
        .hilo .hi {
          font-size: 26px;
        }
      }

      .series-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .schip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text-2);
        font-size: 13px;
        cursor: pointer;
      }

      .schip .swatch {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
      }

      .schip.off {
        opacity: 0.55;
      }

      .schip.off .swatch {
        background: var(--muted) !important;
      }

      .overview {
        margin-top: 4px;
      }

      .overview svg {
        width: 100%;
        height: auto;
        display: block;
        touch-action: none;
        cursor: grab;
      }

      .overview svg.dragging {
        cursor: grabbing;
      }

      .overview svg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      .chart-wrap svg {
        touch-action: pan-y;
      }

      .range-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 4px;
      }

      .range-controls {
        display: flex;
        gap: 6px;
      }

      .chart-wrap {
        position: relative;
      }

      .chart-wrap svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .tooltip {
        position: absolute;
        pointer-events: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        padding: 8px 10px;
        font-size: 13px;
        color: var(--text);
        display: none;
        white-space: nowrap;
        z-index: 5;
      }

      .tooltip .t-time {
        color: var(--muted);
        font-size: 12px;
      }

      details {
        margin-top: 14px;
      }

      summary {
        cursor: pointer;
        color: var(--text-2);
        font-size: 14px;
      }

      .table-wrap {
        overflow-x: auto;
        margin-top: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        padding: 9px 12px;
        text-align: left;
        border-bottom: 1px solid var(--grid);
        font-size: 14px;
        white-space: nowrap;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }

      .now-row td {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .now-row td:first-child {
        font-weight: 600;
      }

      .daily-row {
        display: grid;
        grid-template-columns: 82px 34px 1fr auto auto;
        align-items: center;
        gap: 10px;
        padding: 9px 6px;
        border-bottom: 1px solid var(--grid);
        font-size: 15px;
        background: none;
        border-left: none;
        border-right: none;
        border-top: none;
        width: 100%;
        font-family: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 8px;
      }

      .daily-row:hover {
        background: var(--chip);
      }

      .daily-row:last-child {
        border-bottom: none;
      }

      .daily-row .d-icon {
        font-size: 22px;
        text-align: center;
      }

      .daily-row .d-cond {
        color: var(--text-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .daily-row .d-rain {
        color: var(--text-2);
        font-size: 13px;
        text-align: right;
        min-width: 90px;
      }

      .daily-row .d-temps {
        text-align: right;
        min-width: 90px;
        font-variant-numeric: tabular-nums;
      }

      .daily-row .d-temps .lo {
        color: var(--muted);
      }

      .sun-row {
        margin-top: 12px;
        color: var(--text-2);
        font-size: 14px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .loading {
        color: var(--muted);
      }

      .error {
        color: var(--error);
      }

      @media (max-width: 520px) {
        body {
          padding: 16px 10px;
        }

        .card {
          padding: 16px;
        }

        .now .temp {
          font-size: 40px;
        }

        .daily-row {
          grid-template-columns: 60px 30px auto auto;
        }

        .daily-row .d-cond {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>🌤 Weather</h1>
        <button id="themeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      </div>

      <div class="search">
        <div class="search-box">
          <input
            id="cityInput"
            placeholder="Search city…"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="dropdown" class="dropdown"></div>
        </div>
        <button class="primary" id="searchBtn">Check</button>
        <button class="icon-btn" id="geoBtn" title="Use my location" aria-label="Use my location">📍</button>
      </div>

      <div id="recents" class="recents"></div>

      <div id="result"></div>
    </div>

    <script>
      "use strict";

      // ---------- constants & helpers ----------

      const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
      const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";

      // WMO weather interpretation codes -> [icon, description]
      const WMO = {
        0: ["☀️", "Clear sky"],
        1: ["🌤️", "Mostly clear"],
        2: ["⛅", "Partly cloudy"],
        3: ["☁️", "Overcast"],
        45: ["🌫️", "Fog"],
        48: ["🌫️", "Rime fog"],
        51: ["🌦️", "Light drizzle"],
        53: ["🌦️", "Drizzle"],
        55: ["🌧️", "Heavy drizzle"],
        56: ["🌧️", "Freezing drizzle"],
        57: ["🌧️", "Freezing drizzle"],
        61: ["🌦️", "Light rain"],
        63: ["🌧️", "Rain"],
        65: ["🌧️", "Heavy rain"],
        66: ["🌧️", "Freezing rain"],
        67: ["🌧️", "Freezing rain"],
        71: ["🌨️", "Light snow"],
        73: ["🌨️", "Snow"],
        75: ["❄️", "Heavy snow"],
        77: ["🌨️", "Snow grains"],
        80: ["🌦️", "Light showers"],
        81: ["🌧️", "Showers"],
        82: ["⛈️", "Heavy showers"],
        85: ["🌨️", "Snow showers"],
        86: ["🌨️", "Snow showers"],
        95: ["⛈️", "Thunderstorm"],
        96: ["⛈️", "Thunderstorm, hail"],
        99: ["⛈️", "Thunderstorm, hail"],
      };

      function wmo(code) {
        return WMO[code] || ["🌡️", "—"];
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // API times are ISO strings in the *location's* timezone (timezone=auto).
      // Never round-trip them through Date for clock labels — read the string.
      function clockLabel(iso) {
        return iso.slice(11, 16);
      }

      function dayLabel(dateStr, index) {
        if (index === 0) return "Today";
        const d = new Date(dateStr + "T12:00");
        return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" });
      }

      function debounce(fn, ms) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), ms);
        };
      }

      function placeLabel(p) {
        return [p.name, p.admin1, p.country].filter(Boolean).join(", ");
      }

      // ---------- storage ----------

      function getRecents() {
        try {
          return JSON.parse(localStorage.getItem("wx-recents")) || [];
        } catch {
          return [];
        }
      }

      function addRecent(place) {
        if (!place.name || place.name === "My location") return;
        const rest = getRecents().filter(
          (r) => placeLabel(r) !== placeLabel(place),
        );
        localStorage.setItem(
          "wx-recents",
          JSON.stringify([place, ...rest].slice(0, 5)),
        );
        renderRecents();
      }

      function getLastPlace() {
        try {
          return JSON.parse(localStorage.getItem("wx-last"));
        } catch {
          return null;
        }
      }

      // ---------- data ----------

      async function geocode(query, count) {
        const res = await fetch(
          `${GEO_URL}?name=${encodeURIComponent(query)}&count=${count}`,
        );
        if (!res.ok) throw new Error("Geocoding failed");
        const data = await res.json();
        return data.results || [];
      }

      async function fetchForecast(lat, lon) {
        const url =
          `${FORECAST_URL}?latitude=${lat}&longitude=${lon}` +
          `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,cloud_cover,wind_speed_10m,precipitation` +
          `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,cloud_cover` +
          `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,uv_index_max,sunrise,sunset` +
          `&forecast_days=7&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Weather request failed");
        return res.json();
      }

      // ---------- rendering ----------

      const resultEl = document.getElementById("result");
      const WINDOW = 24; // hours shown in the chart and detail table
      let wxData = null; // last forecast response
      let windowStart = 0; // hourly index where the visible window starts
      let hoverHours = []; // data behind the chart hover layer

      // Chart series: chips act as both legend and toggles.
      const SERIES = {
        temp: { label: "Temperature", varName: "--temp", on: true },
        feels: { label: "Feels like", varName: "--feels", on: false },
        rain: { label: "Rain chance", varName: "--rain", on: true },
        clouds: { label: "Clouds", varName: "--clouds", on: false },
        humid: { label: "Humidity", varName: "--humid", on: false },
        wind: { label: "Wind", varName: "--wind", on: false },
      };
      try {
        const saved = JSON.parse(localStorage.getItem("wx-series")) || {};
        for (const k in SERIES)
          if (typeof saved[k] === "boolean") SERIES[k].on = saved[k];
      } catch {}

      function saveSeries() {
        const s = {};
        for (const k in SERIES) s[k] = SERIES[k].on;
        localStorage.setItem("wx-series", JSON.stringify(s));
      }

      // Narrow containers get a smaller viewBox so SVG text stays legible.
      function isCompact() {
        const el = document.getElementById("chartWrap");
        return (el ? el.clientWidth : innerWidth) < 480;
      }
      let compactState = null; // bucket the charts were last rendered for

      function renderCurrent(place, w) {
        const c = w.current;
        const [icon, cond] = wmo(c.weather_code);
        return `
          <div class="card">
            <div class="place-row">
              <h2>${escapeHtml(place.name)}</h2>
              <span class="small">${[
                escapeHtml(
                  [place.admin1, place.country].filter(Boolean).join(", "),
                ),
                `Local time ${timeTag(c.time)}`,
              ]
                .filter(Boolean)
                .join(" · ")}</span>
            </div>
            <div class="now">
              <div class="icon">${icon}</div>
              <div class="temp">${Math.round(c.temperature_2m)}°C</div>
              <div class="cond">
                ${escapeHtml(cond)}<br />
                <span class="feels">Feels like ${Math.round(
                  c.apparent_temperature,
                )}°C</span>
              </div>
            </div>
            <div class="metrics">
              <div class="metric"><b>${Math.round(c.wind_speed_10m)} km/h</b><span>Wind</span></div>
              <div class="metric"><b>${c.relative_humidity_2m}%</b><span>Humidity</span></div>
              <div class="metric"><b>${c.cloud_cover}%</b><span>Cloud cover</span></div>
              <div class="metric"><b>${c.precipitation} mm</b><span>Precipitation</span></div>
            </div>
            <div class="sun-row">
              <span title="Sunrise" aria-label="Sunrise ${clockLabel(w.daily.sunrise[0])}">🌅 ${clockLabel(w.daily.sunrise[0])}</span>
              <span title="Sunset" aria-label="Sunset ${clockLabel(w.daily.sunset[0])}">🌇 ${clockLabel(w.daily.sunset[0])}</span>
            </div>
          </div>`;
      }

      // ---------- today's summary ----------

      // Hourly indices belonging to one calendar date (location time).
      function dayIndices(w, dateStr) {
        const out = [];
        const t = w.hourly.time;
        for (let i = 0; i < t.length; i++)
          if (t[i].slice(0, 10) === dateStr) out.push(i);
        return out;
      }

      // Rain hours are reported as contiguous runs so the text stays readable.
      function rainRuns(w, idx, minProb) {
        const runs = [];
        let start = -1;
        for (const i of idx) {
          const wet = (w.hourly.precipitation_probability[i] ?? 0) >= minProb;
          if (wet && start < 0) start = i;
          if (!wet && start >= 0) {
            runs.push([start, i]);
            start = -1;
          }
        }
        if (start >= 0) runs.push([start, idx[idx.length - 1] + 1]);
        return runs;
      }

      function dayStats(w) {
        const d = w.daily;
        const date = d.time[0];
        const idx = dayIndices(w, date);
        const now = currentHourIndex(w);
        const rest = idx.filter((i) => i >= now);
        const h = w.hourly;
        const pick = rest.length ? rest : idx;
        let warmest = pick[0];
        for (const i of pick)
          if (h.temperature_2m[i] > h.temperature_2m[warmest]) warmest = i;
        const windMax = idx.reduce(
          (m, i) => Math.max(m, h.wind_speed_10m[i] ?? 0),
          0,
        );
        return {
          date,
          idx,
          rest,
          hi: d.temperature_2m_max[0],
          lo: d.temperature_2m_min[0],
          feelsHi: d.apparent_temperature_max[0],
          feelsLo: d.apparent_temperature_min[0],
          code: d.weather_code[0],
          prob: d.precipitation_probability_max[0] ?? 0,
          sum: d.precipitation_sum[0] ?? 0,
          wind: d.wind_speed_10m_max?.[0] ?? windMax,
          uv: d.uv_index_max?.[0],
          warmestHour: h.time[warmest],
          rain: rainRuns(w, rest.length ? rest : idx, 40),
        };
      }

      const SNOW_CODES = [71, 73, 75, 77, 85, 86];

      function precipWord(code) {
        if (SNOW_CODES.includes(code)) return "Snow";
        if (code >= 95) return "Storms";
        return "Rain";
      }

      function summaryText(w, st) {
        const cond = wmo(st.code)[1].toLowerCase();
        const parts = [];
        parts.push(
          `${cond === "—" ? "Mixed conditions" : cond.charAt(0).toUpperCase() + cond.slice(1)} today, ` +
            `${Math.round(st.lo)}° to ${Math.round(st.hi)}°C, warmest around ${clockLabel(st.warmestHour)}.`,
        );

        if (Math.round(st.feelsHi) !== Math.round(st.hi))
          parts.push(`Feels closer to ${Math.round(st.feelsHi)}° at its peak.`);

        if (st.rain.length) {
          const windows = st.rain
            .slice(0, 2)
            .map(
              ([a, b]) =>
                `${clockLabel(w.hourly.time[a])}–${clockLabel(w.hourly.time[b] ?? w.hourly.time[b - 1])}`,
            )
            .join(" and ");
          parts.push(
            `${precipWord(st.code)} most likely ${windows} (${st.prob}% peak, ${st.sum} mm total).`,
          );
        } else if (st.prob >= 20) {
          parts.push(`Showers possible but unlikely (${st.prob}% peak).`);
        } else {
          parts.push("Little to no rain expected.");
        }

        if (st.wind >= 45) parts.push(`Strong wind, gusting to ${Math.round(st.wind)} km/h.`);
        else if (st.wind >= 25) parts.push(`Breezy, up to ${Math.round(st.wind)} km/h.`);

        if (st.uv >= 8) parts.push(`UV index peaks very high at ${Math.round(st.uv)}.`);
        else if (st.uv >= 6) parts.push(`UV index peaks high at ${Math.round(st.uv)}.`);

        parts.push(`Sun sets ${clockLabel(w.daily.sunset[0])}.`);
        return parts.join(" ");
      }

      // Advice keys off apparent temperature: what the day feels like beats
      // what the thermometer reads.
      function wearAdvice(st) {
        const hi = st.feelsHi;
        const lo = st.feelsLo;
        const items = [];

        if (hi <= 0) items.push(["🧥", "Heavy winter coat"]);
        else if (hi <= 8) items.push(["🧥", "Warm coat"]);
        else if (hi <= 15) items.push(["🧥", "Light jacket"]);
        else if (hi <= 22) items.push(["👕", "Long sleeves"]);
        else items.push(["👕", "T-shirt"]);

        if (hi >= 24) items.push(["🩳", "Shorts weather"]);
        if (hi - lo >= 9 && hi > 12) items.push(["🧅", "Layers — big day swing"]);
        if (lo <= 3) items.push(["🧤", "Gloves and hat"]);
        else if (lo <= 9 && hi >= 16) items.push(["🧣", "Something for the evening"]);

        const snowing = SNOW_CODES.includes(st.code);
        if (snowing) items.push(["❄️", "Snow-ready outer layer"]);
        else if (st.prob >= 60 || st.sum >= 3) items.push(["☔", "Umbrella"]);
        else if (st.prob >= 30) items.push(["🧢", "Rain shell, just in case"]);
        if (st.sum >= 8 || snowing) items.push(["🥾", "Waterproof shoes"]);

        if (st.wind >= 45) items.push(["🌬️", "Windproof outer layer"]);
        if (st.uv >= 6) items.push(["🕶️", "Sunglasses and sunscreen"]);
        if (snowing) items.push(["🦶", "Grip underfoot"]);

        return items;
      }

      function renderToday(w) {
        const st = dayStats(w);
        const items = wearAdvice(st)
          .map(
            ([icon, text]) =>
              `<span class="wear-item">${icon} ${escapeHtml(text)}</span>`,
          )
          .join("");
        return `
          <div class="card">
            <div class="today-top">
              <h3 style="margin:0">Today</h3>
              <div class="hilo">
                <span class="hilo-label">High / low</span>
                <span class="hi">${Math.round(st.hi)}°</span>
                <span class="lo">/ ${Math.round(st.lo)}°</span>
              </div>
            </div>
            <p class="day-summary">${escapeHtml(summaryText(w, st))}</p>
            <div class="wear">
              <h4>Recommended wear</h4>
              <div class="wear-items">${items}</div>
            </div>
          </div>`;
      }

      // Hourly index of the hour containing "now" (location time).
      function currentHourIndex(w) {
        const i = w.hourly.time.findIndex((t) => t > w.current.time) - 1;
        return i < 0 ? 0 : i;
      }

      function hourAt(w, i) {
        const h = w.hourly;
        return {
          time: h.time[i],
          label: clockLabel(h.time[i]),
          temp: h.temperature_2m[i],
          feels: h.apparent_temperature[i],
          wind: h.wind_speed_10m[i],
          prob: h.precipitation_probability[i],
          precip: h.precipitation[i],
          clouds: h.cloud_cover[i],
          humid: h.relative_humidity_2m[i],
          code: h.weather_code[i],
        };
      }

      function windowHours(w, start) {
        const out = [];
        const end = Math.min(start + WINDOW, w.hourly.time.length);
        for (let i = start; i < end; i++) out.push(hourAt(w, i));
        return out;
      }

      // Stacked panels sharing one time axis, one per unit family (a
      // meteogram — never a dual-axis overlay). Panels appear only when a
      // series in them is toggled on.
      function renderChartSvg(hours) {
        const compact = isCompact();
        compactState = compact;
        const W = compact ? 400 : 760;
        const padL = compact ? 40 : 46;
        const padR = 14;
        const innerW = W - padL - padR;
        const step = innerW / hours.length;
        const cx = (i) => padL + step * (i + 0.5);

        const panels = {};
        let cursor = 14;
        function addPanel(key, height) {
          panels[key] = { top: cursor, bottom: cursor + height };
          cursor += height + 26;
        }
        if (SERIES.temp.on || SERIES.feels.on) addPanel("temp", 100);
        if (SERIES.rain.on || SERIES.clouds.on || SERIES.humid.on)
          addPanel("pct", 68);
        if (SERIES.wind.on) addPanel("wind", 56);

        if (!Object.keys(panels).length) {
          return '<p class="small">Turn on a series above to show the chart.</p>';
        }

        const lastBottom = cursor - 26;
        const labelY = lastBottom + 18;
        const H = labelY + 10;

        let s = "";

        const line = (vals, y, color) =>
          `<polyline points="${vals
            .map((v, i) => `${cx(i)},${y(v ?? 0)}`)
            .join(" ")}" fill="none" stroke="${color}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round" />`;

        if (panels.temp) {
          const p = panels.temp;
          const vals = [];
          if (SERIES.temp.on) vals.push(...hours.map((h) => h.temp));
          if (SERIES.feels.on) vals.push(...hours.map((h) => h.feels));
          const tMin = Math.floor(Math.min(...vals)) - 1;
          const tMax = Math.ceil(Math.max(...vals)) + 1;
          const ty = (v) =>
            p.bottom - ((v - tMin) / (tMax - tMin)) * (p.bottom - p.top);
          const mid = Math.round((tMin + tMax) / 2);
          for (const v of [tMin + 1, mid, tMax - 1]) {
            s += `<line x1="${padL}" y1="${ty(v)}" x2="${W - padR}" y2="${ty(v)}"
                    stroke="var(--grid)" stroke-width="1" />
                  <text x="${padL - 6}" y="${ty(v) + 4}" text-anchor="end"
                    font-size="11" fill="var(--muted)">${v}°</text>`;
          }
          if (SERIES.feels.on)
            s += line(hours.map((h) => h.feels), ty, "var(--feels)");
          if (SERIES.temp.on) {
            const temps = hours.map((h) => h.temp);
            s += line(temps, ty, "var(--temp)");
            // direct labels on the extremes only
            const iMax = temps.indexOf(Math.max(...temps));
            const iMin = temps.indexOf(Math.min(...temps));
            for (const [i, dy] of [
              [iMax, -8],
              [iMin, 16],
            ]) {
              s += `<circle cx="${cx(i)}" cy="${ty(temps[i])}" r="4"
                      fill="var(--temp)" stroke="var(--surface)" stroke-width="2" />
                    <text x="${cx(i)}" y="${ty(temps[i]) + dy}" text-anchor="middle"
                      font-size="12" font-weight="600" fill="var(--text)">${Math.round(
                        temps[i],
                      )}°</text>`;
            }
          }
        }

        if (panels.pct) {
          const p = panels.pct;
          const py = (v) => p.bottom - ((v ?? 0) / 100) * (p.bottom - p.top);
          for (const v of [50, 100]) {
            s += `<line x1="${padL}" y1="${py(v)}" x2="${W - padR}" y2="${py(v)}"
                    stroke="var(--grid)" stroke-width="1" />
                  <text x="${padL - 6}" y="${py(v) + 4}" text-anchor="end"
                    font-size="11" fill="var(--muted)">${v}%</text>`;
          }
          s += `<line x1="${padL}" y1="${p.bottom}" x2="${W - padR}" y2="${p.bottom}"
                  stroke="var(--baseline)" stroke-width="1" />`;
          const rainOnly =
            SERIES.rain.on && !SERIES.clouds.on && !SERIES.humid.on;
          const dry = hours.every(
            (h) => (h.prob ?? 0) <= 2 && !h.precip,
          );
          if (rainOnly && dry) {
            s += `<text x="${padL + innerW / 2}" y="${(p.top + p.bottom) / 2 + 4}"
                    text-anchor="middle" font-size="12"
                    fill="var(--muted)">No rain expected</text>`;
          } else if (SERIES.rain.on) {
            // rain-probability bars: thin, rounded data-end, square baseline
            const barW = Math.min(16, step - 4);
            for (let i = 0; i < hours.length; i++) {
              const prob = hours[i].prob ?? 0;
              if (prob <= 0) continue;
              const x = cx(i) - barW / 2;
              const yTop = py(prob);
              const r = Math.min(4, p.bottom - yTop);
              s += `<path d="M${x},${p.bottom} V${yTop + r}
                      Q${x},${yTop} ${x + r},${yTop}
                      H${x + barW - r}
                      Q${x + barW},${yTop} ${x + barW},${yTop + r}
                      V${p.bottom} Z" fill="var(--rain)" />`;
            }
          }
          if (SERIES.clouds.on)
            s += line(hours.map((h) => h.clouds), py, "var(--clouds)");
          if (SERIES.humid.on)
            s += line(hours.map((h) => h.humid), py, "var(--humid)");
        }

        if (panels.wind) {
          const p = panels.wind;
          const wMax = Math.max(
            10,
            Math.ceil(Math.max(...hours.map((h) => h.wind)) / 10) * 10,
          );
          const wy = (v) => p.bottom - (v / wMax) * (p.bottom - p.top);
          s += `<line x1="${padL}" y1="${p.top}" x2="${W - padR}" y2="${p.top}"
                  stroke="var(--grid)" stroke-width="1" />
                <text x="${padL - 6}" y="${p.top + 4}" text-anchor="end"
                  font-size="11" fill="var(--muted)">${wMax}</text>
                <text x="${padL - 6}" y="${p.bottom + 2}" text-anchor="end"
                  font-size="10" fill="var(--muted)">km/h</text>
                <line x1="${padL}" y1="${p.bottom}" x2="${W - padR}" y2="${p.bottom}"
                  stroke="var(--baseline)" stroke-width="1" />`;
          s += line(hours.map((h) => h.wind), wy, "var(--wind)");
        }

        // shared hour labels (sparser when compact)
        for (let i = 0; i < hours.length; i += compact ? 6 : 3) {
          s += `<text x="${cx(i)}" y="${labelY}" text-anchor="middle"
                  font-size="11" fill="var(--muted)">${hours[i].label}</text>`;
        }

        // crosshair (moved by the hover handler)
        s += `<line id="crosshair" x1="0" y1="14" x2="0" y2="${lastBottom}"
                stroke="var(--baseline)" stroke-width="1" visibility="hidden" />`;

        return `<svg id="hourlyChart" viewBox="0 0 ${W} ${H}"
                  data-padl="${padL}" data-padr="${padR}" data-w="${W}"
                  role="img" aria-label="Hourly forecast chart">${s}</svg>`;
      }

      function renderHourlyCard() {
        return `
          <div class="card">
            <h3>Hourly forecast</h3>
            <div class="series-chips" id="seriesChips"></div>
            <div class="chart-wrap" id="chartWrap"></div>
            <div class="overview" id="overviewWrap"></div>
            <details id="hourlyDetails"${
              localStorage.getItem("wx-details-open") === "1" ? " open" : ""
            }>
              <summary>Hourly details</summary>
              <div class="table-wrap" id="hourlyTable"></div>
            </details>
          </div>`;
      }

      function refreshChips() {
        document.getElementById("seriesChips").innerHTML = Object.entries(
          SERIES,
        )
          .map(
            ([k, sr]) => `
              <button class="schip${sr.on ? "" : " off"}" data-k="${k}"
                aria-pressed="${sr.on}">
                <span class="swatch" style="background:var(${sr.varName})"></span>${sr.label}
              </button>`,
          )
          .join("");
      }

      function refreshChart() {
        hoverHours = windowHours(wxData, windowStart);
        document.getElementById("chartWrap").innerHTML =
          renderChartSvg(hoverHours) +
          '<div class="tooltip" id="chartTip"></div>';
        attachChartHover();
      }

      function refreshTable() {
        const ni = currentHourIndex(wxData);
        const rows = hoverHours
          .map(
            (h, idx) => `
              <tr${
                windowStart + idx === ni
                  ? ' class="now-row" aria-current="time"'
                  : ""
              }>
                <td>${h.label}</td>
                <td>${wmo(h.code)[0]}</td>
                <td>${Math.round(h.temp)}°C</td>
                <td>${Math.round(h.feels)}°C</td>
                <td>${h.prob ?? "–"}%</td>
                <td>${h.precip} mm</td>
                <td>${Math.round(h.wind)} km/h</td>
                <td>${h.clouds}%</td>
                <td>${h.humid}%</td>
              </tr>`,
          )
          .join("");
        document.getElementById("hourlyTable").innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Time</th><th></th><th>Temp</th><th>Feels</th>
                <th>Rain %</th><th>Rain mm</th><th>Wind</th>
                <th>Clouds</th><th>Humidity</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      // ---------- 7-day overview strip with a draggable 24h window ----------

      const OV = { W: 760, H: 70, padL: 8, padR: 8, top: 8, bottom: 48, labelY: 64 };

      function timeTag(iso) {
        const wd = new Date(iso.slice(0, 10) + "T12:00").toLocaleDateString(
          undefined,
          { weekday: "short" },
        );
        return `${wd} ${iso.slice(11, 16)}`;
      }

      function windowRectX() {
        const svg = document.getElementById("overviewSvg");
        const W = svg ? +svg.dataset.w : OV.W;
        const n = wxData.hourly.time.length;
        const x = (i) => OV.padL + (i / (n - 1)) * (W - OV.padL - OV.padR);
        return {
          x0: x(windowStart),
          x1: x(Math.min(windowStart + WINDOW, n - 1)),
        };
      }

      function renderOverviewSvg() {
        const W = isCompact() ? 400 : 760;
        const h = wxData.hourly;
        const n = h.time.length;
        const x = (i) => OV.padL + (i / (n - 1)) * (W - OV.padL - OV.padR);
        const temps = h.temperature_2m;
        const tMin = Math.min(...temps);
        const tMax = Math.max(...temps);
        const ty = (v) =>
          OV.bottom -
          ((v - tMin) / (tMax - tMin || 1)) * (OV.bottom - OV.top);
        const gripTop = (4 + OV.bottom) / 2 - 6;

        let s = `<line x1="${OV.padL}" y1="${OV.bottom}" x2="${W - OV.padR}"
                   y2="${OV.bottom}" stroke="var(--baseline)" stroke-width="1" />`;
        for (let i = 0; i < n; i++) {
          if (h.time[i].slice(11) !== "00:00") continue;
          s += `<line x1="${x(i)}" y1="${OV.top}" x2="${x(i)}" y2="${OV.bottom}"
                  stroke="var(--grid)" stroke-width="1" />`;
          if (i + 12 < n)
            s += `<text x="${x(i + 12)}" y="${OV.labelY}" text-anchor="middle"
                    font-size="11" fill="var(--muted)">${new Date(
                      h.time[i].slice(0, 10) + "T12:00",
                    ).toLocaleDateString(undefined, { weekday: "short" })}</text>`;
        }
        s += `<polyline points="${temps
          .map((v, i) => `${x(i)},${ty(v)}`)
          .join(" ")}" fill="none" stroke="var(--temp)" stroke-width="1.5"
            opacity="0.55" />`;
        const ni = currentHourIndex(wxData);
        s += `<line x1="${x(ni)}" y1="${OV.top}" x2="${x(ni)}" y2="${OV.bottom}"
                stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" />`;
        const { x0, x1 } = windowRectX0(W, n);
        s += `<rect id="winRect" x="${x0}" y="4" width="${x1 - x0}"
                height="${OV.bottom - 4}" rx="7" fill="var(--accent)"
                fill-opacity="0.12" stroke="var(--accent)" stroke-width="1.5" />`;
        // grip lines: the drag affordance on the window's edges
        for (const [id, gx] of [
          ["winGrip1", x0 + 5],
          ["winGrip2", x1 - 5],
        ]) {
          s += `<line id="${id}" x1="${gx}" y1="${gripTop}" x2="${gx}"
                  y2="${gripTop + 12}" stroke="var(--accent)" stroke-width="2"
                  stroke-linecap="round" opacity="0.7" />`;
        }
        return `<svg id="overviewSvg" viewBox="0 0 ${W} ${OV.H}" data-w="${W}"
                  tabindex="0" role="slider" aria-label="Forecast window, 7 day timeline"
                  aria-valuemin="0" aria-valuemax="${Math.max(0, n - WINDOW)}"
                  aria-valuenow="${windowStart}"
                  aria-valuetext="${rangeLabelText()}">${s}</svg>`;
      }

      // same math as windowRectX, usable before the svg exists in the DOM
      function windowRectX0(W, n) {
        const x = (i) => OV.padL + (i / (n - 1)) * (W - OV.padL - OV.padR);
        return {
          x0: x(windowStart),
          x1: x(Math.min(windowStart + WINDOW, n - 1)),
        };
      }

      function rangeLabelText() {
        const t = wxData.hourly.time;
        const end = Math.min(windowStart + WINDOW, t.length) - 1;
        return `${timeTag(t[windowStart])} – ${timeTag(t[end])}`;
      }

      function updateOverviewWindow() {
        const rect = document.getElementById("winRect");
        if (rect) {
          const { x0, x1 } = windowRectX();
          rect.setAttribute("x", x0);
          rect.setAttribute("width", x1 - x0);
          for (const [id, gx] of [
            ["winGrip1", x0 + 5],
            ["winGrip2", x1 - 5],
          ]) {
            const g = document.getElementById(id);
            if (g) {
              g.setAttribute("x1", gx);
              g.setAttribute("x2", gx);
            }
          }
        }
        const svg = document.getElementById("overviewSvg");
        if (svg) {
          svg.setAttribute("aria-valuenow", windowStart);
          svg.setAttribute("aria-valuetext", rangeLabelText());
        }
        const lbl = document.getElementById("rangeLabel");
        if (lbl) lbl.textContent = rangeLabelText();
        const nowBtn = document.getElementById("nowBtn");
        if (nowBtn)
          nowBtn.style.visibility =
            windowStart === currentHourIndex(wxData) ? "hidden" : "visible";
      }

      function setWindowStart(v) {
        const maxStart = Math.max(0, wxData.hourly.time.length - WINDOW);
        const next = Math.max(0, Math.min(maxStart, Math.round(v)));
        if (next === windowStart) return;
        windowStart = next;
        refreshChart();
        refreshTable();
        updateOverviewWindow();
      }

      function attachOverviewDrag() {
        const svg = document.getElementById("overviewSvg");
        if (!svg) return;
        const n = wxData.hourly.time.length;
        let grabOffset = 0;
        const idxAt = (clientX) => {
          const r = svg.getBoundingClientRect();
          return ((clientX - r.left) / r.width) * (n - 1);
        };
        svg.addEventListener("pointerdown", (e) => {
          const i = idxAt(e.clientX);
          grabOffset =
            i >= windowStart && i <= windowStart + WINDOW
              ? i - windowStart
              : WINDOW / 2;
          setWindowStart(i - grabOffset);
          svg.setPointerCapture(e.pointerId);
          svg.classList.add("dragging");
          e.preventDefault();
        });
        svg.addEventListener("pointermove", (e) => {
          if (svg.classList.contains("dragging"))
            setWindowStart(idxAt(e.clientX) - grabOffset);
        });
        const stop = () => svg.classList.remove("dragging");
        svg.addEventListener("pointerup", stop);
        svg.addEventListener("pointercancel", stop);
        svg.addEventListener("keydown", (e) => {
          const stepH = e.shiftKey ? 24 : 3;
          if (e.key === "ArrowLeft") setWindowStart(windowStart - stepH);
          else if (e.key === "ArrowRight") setWindowStart(windowStart + stepH);
          else if (e.key === "Home") setWindowStart(currentHourIndex(wxData));
          else return;
          e.preventDefault();
        });
      }

      function refreshOverview() {
        document.getElementById("overviewWrap").innerHTML =
          renderOverviewSvg() +
          `<div class="range-row">
             <span class="small" id="rangeLabel">${rangeLabelText()}</span>
             <span class="range-controls">
               <button class="icon-btn btn-sm" id="stepBack" aria-label="Back one day">◀</button>
               <button class="icon-btn btn-sm" id="nowBtn">Now</button>
               <button class="icon-btn btn-sm" id="stepFwd" aria-label="Forward one day">▶</button>
             </span>
           </div>`;
        attachOverviewDrag();
        document
          .getElementById("nowBtn")
          .addEventListener("click", () =>
            setWindowStart(currentHourIndex(wxData)),
          );
        document
          .getElementById("stepBack")
          .addEventListener("click", () => setWindowStart(windowStart - 24));
        document
          .getElementById("stepFwd")
          .addEventListener("click", () => setWindowStart(windowStart + 24));
        updateOverviewWindow();
      }

      function refreshHourly() {
        refreshChips();
        refreshChart();
        refreshOverview();
        refreshTable();
        document
          .getElementById("seriesChips")
          .addEventListener("click", (e) => {
            const chipEl = e.target.closest(".schip");
            if (!chipEl) return;
            const k = chipEl.dataset.k;
            SERIES[k].on = !SERIES[k].on;
            saveSeries();
            refreshChips();
            refreshChart();
          });
        const det = document.getElementById("hourlyDetails");
        det.addEventListener("toggle", () =>
          localStorage.setItem("wx-details-open", det.open ? "1" : "0"),
        );
      }

      function renderDaily(w) {
        const d = w.daily;
        const rows = d.time
          .map((date, i) => {
            const [icon, cond] = wmo(d.weather_code[i]);
            const rain =
              (d.precipitation_probability_max[i] ?? 0) > 0 ||
              d.precipitation_sum[i] > 0
                ? `${d.precipitation_probability_max[i] ?? 0}% · ${d.precipitation_sum[i]} mm`
                : "";
            return `
              <button class="daily-row" data-date="${date}" data-i="${i}"
                title="Show this day in the hourly view">
                <span>${dayLabel(date, i)}</span>
                <span class="d-icon">${icon}</span>
                <span class="d-cond">${escapeHtml(cond)}</span>
                <span class="d-rain">${rain}</span>
                <span class="d-temps">${Math.round(d.temperature_2m_max[i])}°
                  <span class="lo">/ ${Math.round(d.temperature_2m_min[i])}°</span></span>
              </button>`;
          })
          .join("");
        return `<div class="card"><h3>7-day forecast</h3>${rows}</div>`;
      }

      function hoverLines(h) {
        const lines = [];
        if (SERIES.temp.on) lines.push(`${Math.round(h.temp)}°C`);
        if (SERIES.feels.on) lines.push(`feels ${Math.round(h.feels)}°C`);
        if (SERIES.rain.on)
          lines.push(`rain ${h.prob ?? "–"}% (${h.precip} mm)`);
        if (SERIES.clouds.on) lines.push(`clouds ${h.clouds}%`);
        if (SERIES.humid.on) lines.push(`humidity ${h.humid}%`);
        if (SERIES.wind.on) lines.push(`wind ${Math.round(h.wind)} km/h`);
        return lines.join(" · ");
      }

      function attachChartHover() {
        const wrap = document.getElementById("chartWrap");
        const svg = document.getElementById("hourlyChart");
        const tip = document.getElementById("chartTip");
        if (!wrap || !svg || !tip) return;
        const crosshair = svg.querySelector("#crosshair");
        const padL = +svg.dataset.padl;
        const padR = +svg.dataset.padr;
        const vbW = +svg.dataset.w;

        function onMove(e) {
          const rect = svg.getBoundingClientRect();
          const scale = vbW / rect.width;
          const vx = (e.clientX - rect.left) * scale;
          const innerW = vbW - padL - padR;
          const idx = Math.floor(((vx - padL) / innerW) * hoverHours.length);
          if (idx < 0 || idx >= hoverHours.length || vx < padL) {
            onLeave();
            return;
          }
          const h = hoverHours[idx];
          const step = innerW / hoverHours.length;
          const cxv = padL + step * (idx + 0.5);
          crosshair.setAttribute("x1", cxv);
          crosshair.setAttribute("x2", cxv);
          crosshair.setAttribute("visibility", "visible");
          tip.innerHTML = `
            <div class="t-time">${h.label} · ${escapeHtml(wmo(h.code)[1])}</div>
            <div>${hoverLines(h)}</div>`;
          tip.style.display = "block";
          const wrapRect = wrap.getBoundingClientRect();
          const px = (cxv / scale) + rect.left - wrapRect.left;
          const tipW = tip.offsetWidth;
          let left = px + 12;
          if (left + tipW > wrapRect.width) left = px - tipW - 12;
          tip.style.left = `${Math.max(0, left)}px`;
          tip.style.top = `20px`;
        }

        function onLeave() {
          crosshair.setAttribute("visibility", "hidden");
          tip.style.display = "none";
        }

        // bind to the svg (recreated each render) so listeners never stack up;
        // pointer events also give touch users tap-to-inspect
        svg.addEventListener("pointermove", onMove);
        svg.addEventListener("pointerdown", onMove);
        svg.addEventListener("pointerleave", onLeave);
      }

      // ---------- main flow ----------

      async function loadWeather(place) {
        resultEl.innerHTML = '<p class="loading">Loading weather…</p>';
        try {
          const w = await fetchForecast(place.latitude, place.longitude);
          wxData = w;
          windowStart = Math.min(
            currentHourIndex(w),
            Math.max(0, w.hourly.time.length - WINDOW),
          );
          resultEl.innerHTML =
            renderCurrent(place, w) +
            renderToday(w) +
            renderHourlyCard() +
            renderDaily(w);
          refreshHourly();
          localStorage.setItem("wx-last", JSON.stringify(place));
          addRecent(place);
        } catch (err) {
          resultEl.innerHTML = `<p class="error">Error: ${escapeHtml(err.message)}</p>`;
        }
      }

      async function searchAndLoad(query) {
        if (!query) return;
        closeDropdown();
        resultEl.innerHTML = '<p class="loading">Searching…</p>';
        try {
          const results = await geocode(query, 1);
          if (!results.length) throw new Error("City not found");
          await loadWeather(results[0]);
        } catch (err) {
          resultEl.innerHTML = `<p class="error">Error: ${escapeHtml(err.message)}</p>`;
        }
      }

      // ---------- search UI: autocomplete ----------

      const input = document.getElementById("cityInput");
      const dropdown = document.getElementById("dropdown");
      let suggestions = [];
      let activeIdx = -1;

      function closeDropdown() {
        dropdown.classList.remove("open");
        dropdown.innerHTML = "";
        suggestions = [];
        activeIdx = -1;
      }

      function renderDropdown() {
        if (!suggestions.length) {
          closeDropdown();
          return;
        }
        dropdown.innerHTML = suggestions
          .map(
            (p, i) => `
              <div class="dropdown-item${i === activeIdx ? " active" : ""}" data-i="${i}">
                ${escapeHtml(p.name)}
                <span class="sub">${escapeHtml(
                  [p.admin1, p.country].filter(Boolean).join(", "),
                )}</span>
              </div>`,
          )
          .join("");
        dropdown.classList.add("open");
      }

      const fetchSuggestions = debounce(async () => {
        const q = input.value.trim();
        if (q.length < 2) {
          closeDropdown();
          return;
        }
        try {
          suggestions = await geocode(q, 5);
          activeIdx = -1;
          renderDropdown();
        } catch {
          closeDropdown();
        }
      }, 300);

      function pickSuggestion(i) {
        const place = suggestions[i];
        if (!place) return;
        input.value = place.name;
        closeDropdown();
        loadWeather(place);
      }

      input.addEventListener("input", fetchSuggestions);

      input.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" && suggestions.length) {
          activeIdx = (activeIdx + 1) % suggestions.length;
          renderDropdown();
          e.preventDefault();
        } else if (e.key === "ArrowUp" && suggestions.length) {
          activeIdx =
            (activeIdx - 1 + suggestions.length) % suggestions.length;
          renderDropdown();
          e.preventDefault();
        } else if (e.key === "Enter") {
          if (activeIdx >= 0) pickSuggestion(activeIdx);
          else searchAndLoad(input.value.trim());
        } else if (e.key === "Escape") {
          closeDropdown();
        }
      });

      dropdown.addEventListener("mousedown", (e) => {
        const item = e.target.closest(".dropdown-item");
        if (item) pickSuggestion(+item.dataset.i);
      });

      input.addEventListener("blur", () => setTimeout(closeDropdown, 150));

      document
        .getElementById("searchBtn")
        .addEventListener("click", () => searchAndLoad(input.value.trim()));

      // ---------- geolocation ----------

      document.getElementById("geoBtn").addEventListener("click", () => {
        if (!navigator.geolocation) {
          resultEl.innerHTML =
            '<p class="error">Geolocation is not supported by this browser.</p>';
          return;
        }
        resultEl.innerHTML = '<p class="loading">Locating…</p>';
        navigator.geolocation.getCurrentPosition(
          (pos) =>
            loadWeather({
              name: "My location",
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude,
            }),
          () => {
            resultEl.innerHTML =
              '<p class="error">Could not get your location.</p>';
          },
        );
      });

      // ---------- recents ----------

      function renderRecents() {
        const recents = getRecents();
        document.getElementById("recents").innerHTML = recents
          .map(
            (p, i) =>
              `<button class="chip" data-i="${i}">${escapeHtml(p.name)}</button>`,
          )
          .join("");
      }

      document.getElementById("recents").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        const place = getRecents()[+chip.dataset.i];
        if (place) {
          input.value = place.name;
          loadWeather(place);
        }
      });

      // ---------- theme ----------

      const themeBtn = document.getElementById("themeToggle");

      function applyTheme(theme) {
        if (theme) document.documentElement.dataset.theme = theme;
        else delete document.documentElement.dataset.theme;
        const dark =
          theme === "dark" ||
          (!theme && matchMedia("(prefers-color-scheme: dark)").matches);
        themeBtn.textContent = dark ? "☀️" : "🌙";
      }

      themeBtn.addEventListener("click", () => {
        const current =
          document.documentElement.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        const next = current === "dark" ? "light" : "dark";
        localStorage.setItem("wx-theme", next);
        applyTheme(next);
      });

      applyTheme(localStorage.getItem("wx-theme") || undefined);

      // ---------- daily-row -> hourly window jump ----------

      resultEl.addEventListener("click", (e) => {
        const row = e.target.closest(".daily-row");
        if (!row || !wxData) return;
        const i = +row.dataset.i;
        const target =
          i === 0
            ? currentHourIndex(wxData)
            : wxData.hourly.time.indexOf(row.dataset.date + "T06:00");
        if (target < 0) return;
        setWindowStart(target);
        document
          .getElementById("chartWrap")
          .scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      // re-render charts when the layout crosses the compact breakpoint
      let resizeT;
      addEventListener("resize", () => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
          if (wxData && isCompact() !== compactState) {
            refreshChart();
            refreshOverview();
          }
        }, 150);
      });

      // ---------- init ----------

      renderRecents();
      const last = getLastPlace();
      if (last && last.latitude != null) {
        input.value = last.name === "My location" ? "" : last.name;
        loadWeather(last);
      } else {
        searchAndLoad("Warsaw");
      }
    </script>
  </body>
</html>
