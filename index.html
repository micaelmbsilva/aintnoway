            refreshChart();
          });
        const det = document.getElementById("hourlyDetails");
        det.addEventListener("toggle", () =>
          localStorage.setItem("wx-details-open", det.open ? "1" : "0"),
        );
      }

      // Native title text for a forecast row: the numbers the row has no room
      // to show, not a description of what clicking does.
      function dayDetail(d, i, cond) {
        const bits = [
          `${dayLabel(d.time[i], i)} · ${cond}`,
          `${fTemp(d.temperature_2m_max[i])} / ${fTemp(d.temperature_2m_min[i], true)}`,
          `feels ${fTemp(d.apparent_temperature_max[i])} / ${fTemp(d.apparent_temperature_min[i])}`,
          `rain ${d.precipitation_probability_max[i] ?? 0}% · ${fPrecip(d.precipitation_sum[i], true)}`,
          `wind ${fWind(d.wind_speed_10m_max?.[i] ?? 0, true)}`,
        ];
        if (d.uv_index_max?.[i] != null)
          bits.push(`UV ${Math.round(d.uv_index_max[i])}`);
        return bits.join(" · ") + " — tap to show this day hourly";
      }

      function renderDaily(w) {
        const d = w.daily;
        const rows = d.time
          .map((date, i) => {
            const [icon, cond] = wmo(d.weather_code[i]);
            const rain =
              (d.precipitation_probability_max[i] ?? 0) > 0 ||
              d.precipitation_sum[i] > 0
                ? `${d.precipitation_probability_max[i] ?? 0}% · ${fPrecip(d.precipitation_sum[i], true)}`
                : "";
            return `
              <button class="daily-row" data-date="${date}" data-i="${i}"
                title="${escapeHtml(dayDetail(d, i, cond))}">
                <span>${dayLabel(date, i)}</span>
                <span class="d-icon">${icon}</span>
                <span class="d-cond">${escapeHtml(cond)}</span>
                <span class="d-rain">${rain}</span>
                <span class="d-temps">${fTemp(d.temperature_2m_max[i])}
                  <span class="lo">/ ${fTemp(d.temperature_2m_min[i])}</span></span>
              </button>`;
          })
          .join("");
        return `<div class="card"><h3>7-day forecast</h3>${rows}</div>`;
      }

      function hoverLines(h) {
        const lines = [];
        if (SERIES.temp.on) lines.push(fTemp(h.temp, true));
        if (SERIES.feels.on) lines.push(`feels ${fTemp(h.feels, true)}`);
        if (SERIES.rain.on)
          lines.push(`rain ${h.prob ?? "–"}% (${fPrecip(h.precip, true)})`);
        if (SERIES.clouds.on) lines.push(`clouds ${h.clouds}%`);
        if (SERIES.humid.on) lines.push(`humidity ${h.humid}%`);
        if (SERIES.wind.on) lines.push(`wind ${fWind(h.wind, true)}`);
        return lines.join(" · ");
      }

      // Places a tooltip beside the pointer inside a positioned wrapper,
      // flipping to the left when it would overflow the right edge.
      function positionTip(wrap, tip, clientX, top) {
        const wrapRect = wrap.getBoundingClientRect();
        const px = clientX - wrapRect.left;
        const tipW = tip.offsetWidth;
        let left = px + 12;
        if (left + tipW > wrapRect.width) left = px - tipW - 12;
        tip.style.left = `${Math.max(0, left)}px`;
        tip.style.top = `${top}px`;
      }

      function attachChartHover() {
        const wrap = document.getElementById("chartWrap");
        const svg = document.getElementById("hourlyChart");
        const tip = document.getElementById("chartTip");
        if (!wrap || !svg || !tip) return;
        const crosshair = svg.querySelector("#crosshair");
        const padL = +svg.dataset.padl;
        const padR = +svg.dataset.padr;
        const vbW = +svg.dataset.w;

        function onMove(e) {
          const rect = svg.getBoundingClientRect();
          const scale = vbW / rect.width;
          const vx = (e.clientX - rect.left) * scale;
          const innerW = vbW - padL - padR;
          const idx = Math.floor(((vx - padL) / innerW) * hoverHours.length);
          if (idx < 0 || idx >= hoverHours.length || vx < padL) {
            onLeave();
            return;
          }
          const h = hoverHours[idx];
          const step = innerW / hoverHours.length;
          const cxv = padL + step * (idx + 0.5);
          crosshair.setAttribute("x1", cxv);
          crosshair.setAttribute("x2", cxv);
          crosshair.setAttribute("visibility", "visible");
          tip.innerHTML = `
            <div class="t-time">${h.label} · ${escapeHtml(wmo(h.code)[1])}</div>
            <div>${hoverLines(h)}</div>`;
          tip.style.display = "block";
          positionTip(wrap, tip, rect.left + cxv / scale, 20);
        }

        function onLeave() {
          crosshair.setAttribute("visibility", "hidden");
          tip.style.display = "none";
        }

        // bind to the svg (recreated each render) so listeners never stack up;
        // pointer events also give touch users tap-to-inspect
        svg.addEventListener("pointermove", onMove);
        svg.addEventListener("pointerdown", onMove);
        svg.addEventListener("pointerleave", onLeave);
      }

      // ---------- main flow ----------

      let currentPlace = null; // place behind the rendered forecast
      let fetchedAt = 0; // epoch ms of the last successful forecast

      // Re-renders everything from the cached response. Unit changes go
      // through here: the data is metric, only the formatting differs.
      function renderAll() {
        if (!wxData || !currentPlace) return;
        resultEl.innerHTML =
          renderCurrent(currentPlace, wxData) +
          renderNowcast(wxData) +
          renderToday(wxData) +
          renderHourlyCard() +
          renderDaily(wxData) +
          `<div id="airSlot">${lastAir ? renderAir(lastAir) : ""}</div>`;
        refreshHourly();
        renderStatus();
        if (lastHistory) {
          renderContext(lastHistory);
          renderScore(lastHistoryPlace, lastHistory);
        }
        if (lastAgreement)
          renderAgreement(
            agreementFrom(lastAgreement.data, lastAgreement.headlineWet),
            lastAgreement.headlineWet,
          );
      }

      async function loadWeather(place, opts = {}) {
        const quiet = opts.quiet && wxData; // background refresh keeps the view
        if (quiet) resultEl.classList.add("stale");
        else resultEl.innerHTML = '<p class="loading">Loading weather…</p>';
        try {
          const w = await fetchForecast(place.latitude, place.longitude);
          wxData = w;
          currentPlace = place;
          fetchedAt = Date.now();
          setOffline(false);
          windowStart = Math.min(
            currentHourIndex(w),
            Math.max(0, w.hourly.time.length - WINDOW),
          );
          renderAll();
          localStorage.setItem("wx-last", JSON.stringify(place));
          addRecent(place);
          syncUrl(place);
          lastAgreement = null;
          lastHistory = null;
          logForecast(place, w, dayStats(w));
          loadAgreement(place, (w.daily.precipitation_sum?.[0] ?? 0) >= 0.5);
          loadHistory(place);
          lastAir = null;
          loadAir(place);
        } catch (err) {
          // A cached response served by the service worker still renders; a
          // hard failure with nothing cached is the only true error state.
          if (wxData) setOffline(true);
          else
            resultEl.innerHTML = `<p class="error">Error: ${escapeHtml(err.message)}</p>`;
        } finally {
          resultEl.classList.remove("stale");
        }
      }

      // ---------- freshness ----------

      const STALE_MS = 15 * 60 * 1000;
      const statusEl = document.getElementById("statusbar");
      const updatedEl = document.getElementById("updatedAt");

      function renderStatus() {
        if (!fetchedAt) {
          statusEl.hidden = true;
          return;
        }
        statusEl.hidden = false;
        const t = new Date(fetchedAt).toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
          hour12: units.clock === "12",
        });
        updatedEl.textContent = `Updated ${t} · Open-Meteo`;
      }

      function refreshNow(quiet) {
        if (currentPlace) loadWeather(currentPlace, { quiet });
      }

      document
        .getElementById("refreshBtn")
        .addEventListener("click", () => refreshNow(true));

      // Coming back to a backgrounded tab is the moment stale numbers are most
      // likely to be believed, so re-check then rather than on a timer.
      addEventListener("visibilitychange", () => {
        if (
          document.visibilityState === "visible" &&
          fetchedAt &&
          Date.now() - fetchedAt > STALE_MS
        )
          refreshNow(true);
      });

      // ---------- offline banner ----------

      const offlineBanner = document.getElementById("offlineBanner");

      function setOffline(on) {
        offlineBanner.classList.toggle("show", !!on);
        if (on && fetchedAt) {
          const t = new Date(fetchedAt).toLocaleTimeString(undefined, {
            hour: "2-digit",
            minute: "2-digit",
            hour12: units.clock === "12",
          });
          document.getElementById("offlineText").textContent =
            `Offline — showing the forecast from ${t}.`;
        }
      }

      addEventListener("online", () => refreshNow(true));
      addEventListener("offline", () => setOffline(true));

      // ---------- shareable URL ----------

      function syncUrl(place) {
        const u = new URL(location.href);
        u.searchParams.set("lat", place.latitude.toFixed(4));
        u.searchParams.set("lon", place.longitude.toFixed(4));
        u.searchParams.set("name", place.name);
        history.replaceState(null, "", u);
      }

      function placeFromUrl() {
        const p = new URLSearchParams(location.search);
        const lat = parseFloat(p.get("lat"));
        const lon = parseFloat(p.get("lon"));
        if (!isFinite(lat) || !isFinite(lon)) return null;
        return {
          name: p.get("name") || "Shared location",
          latitude: lat,
          longitude: lon,
        };
      }

      document.getElementById("shareBtn").addEventListener("click", async () => {
        const url = location.href;
        const title = currentPlace ? `Weather in ${currentPlace.name}` : "Weather";
        try {
          if (navigator.share) await navigator.share({ title, url });
          else {
            await navigator.clipboard.writeText(url);
            toast("Link copied");
          }
        } catch {
          /* user dismissed the share sheet */
        }
      });

      function toast(msg) {
        const el = document.createElement("div");
        el.className = "banner show";
        el.textContent = msg;
        statusEl.before(el);
        setTimeout(() => el.remove(), 2200);
      }

      async function searchAndLoad(query) {
        if (!query) return;
        closeDropdown();
        resultEl.innerHTML = '<p class="loading">Searching…</p>';
        try {
          const results = await geocode(query, 1);
          if (!results.length) throw new Error("City not found");
          await loadWeather(results[0]);
        } catch (err) {
          resultEl.innerHTML = `<p class="error">Error: ${escapeHtml(err.message)}</p>`;
        }
      }

      // ---------- search UI: autocomplete ----------

      const input = document.getElementById("cityInput");
      const dropdown = document.getElementById("dropdown");
      let suggestions = [];
      let activeIdx = -1;

      function closeDropdown() {
        dropdown.classList.remove("open");
        dropdown.innerHTML = "";
        suggestions = [];
        activeIdx = -1;
      }

      function renderDropdown() {
        if (!suggestions.length) {
          closeDropdown();
          return;
        }
        dropdown.innerHTML = suggestions
          .map(
            (p, i) => `
              <div class="dropdown-item${i === activeIdx ? " active" : ""}" data-i="${i}">
                ${escapeHtml(p.name)}
                <span class="sub">${escapeHtml(
                  [p.admin1, p.country].filter(Boolean).join(", "),
                )}</span>
              </div>`,
          )
          .join("");
        dropdown.classList.add("open");
      }

      const fetchSuggestions = debounce(async () => {
        const q = input.value.trim();
        if (q.length < 2) {
          closeDropdown();
          return;
        }
        try {
          suggestions = await geocode(q, 5);
          activeIdx = -1;
          renderDropdown();
        } catch {
          closeDropdown();
        }
      }, 300);

      function pickSuggestion(i) {
        const place = suggestions[i];
        if (!place) return;
        input.value = place.name;
        closeDropdown();
        loadWeather(place);
      }

      input.addEventListener("input", fetchSuggestions);

      input.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" && suggestions.length) {
          activeIdx = (activeIdx + 1) % suggestions.length;
          renderDropdown();
          e.preventDefault();
        } else if (e.key === "ArrowUp" && suggestions.length) {
          activeIdx =
            (activeIdx - 1 + suggestions.length) % suggestions.length;
          renderDropdown();
          e.preventDefault();
        } else if (e.key === "Enter") {
          if (activeIdx >= 0) pickSuggestion(activeIdx);
          else searchAndLoad(input.value.trim());
        } else if (e.key === "Escape") {
          closeDropdown();
        }
      });

      dropdown.addEventListener("mousedown", (e) => {
        const item = e.target.closest(".dropdown-item");
        if (item) pickSuggestion(+item.dataset.i);
      });

      input.addEventListener("blur", () => setTimeout(closeDropdown, 150));

      document
        .getElementById("searchBtn")
        .addEventListener("click", () => searchAndLoad(input.value.trim()));

      // ---------- geolocation ----------

      document.getElementById("geoBtn").addEventListener("click", () => {
        if (!navigator.geolocation) {
          resultEl.innerHTML =
            '<p class="error">Geolocation is not supported by this browser.</p>';
          return;
        }
        resultEl.innerHTML = '<p class="loading">Locating…</p>';
        navigator.geolocation.getCurrentPosition(
          (pos) =>
            loadWeather({
              name: "My location",
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude,
            }),
          () => {
            resultEl.innerHTML =
              '<p class="error">Could not get your location.</p>';
          },
        );
      });

      // ---------- recents ----------

      function renderRecents() {
        const recents = getRecents();
        document.getElementById("recents").innerHTML = recents
          .map(
            (p, i) =>
              `<button class="chip" data-i="${i}">${escapeHtml(p.name)}</button>`,
          )
          .join("");
      }

      document.getElementById("recents").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        const place = getRecents()[+chip.dataset.i];
        if (place) {
          input.value = place.name;
          loadWeather(place);
        }
      });

      // ---------- theme ----------

      const themeBtn = document.getElementById("themeToggle");

      function applyTheme(theme) {
        if (theme) document.documentElement.dataset.theme = theme;
        else delete document.documentElement.dataset.theme;
        const dark =
          theme === "dark" ||
          (!theme && matchMedia("(prefers-color-scheme: dark)").matches);
        themeBtn.textContent = dark ? "☀️" : "🌙";
      }

      themeBtn.addEventListener("click", () => {
        const current =
          document.documentElement.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        const next = current === "dark" ? "light" : "dark";
        localStorage.setItem("wx-theme", next);
        applyTheme(next);
      });

      applyTheme(localStorage.getItem("wx-theme") || undefined);

      // ---------- nowcast bar hover ----------

      // Delegated: the strip is re-rendered on every refresh and unit change.
      resultEl.addEventListener("pointermove", (e) => {
        const tip = document.getElementById("ncTip");
        if (!tip) return;
        const bar = e.target.closest(".nc-bars i");
        const host = document.querySelector(".nowcast");
        if (!bar || !host) {
          tip.style.display = "none";
          return;
        }
        const mm = +bar.dataset.mm;
        tip.innerHTML = `
          <div class="t-time">${bar.dataset.time}</div>
          <div>${mm > 0 ? fPrecip(mm, true) : "dry"} · ${bar.dataset.prob}% chance</div>`;
        tip.style.display = "block";
        positionTip(host, tip, e.clientX, 4);
      });

      resultEl.addEventListener("pointerleave", () => {
        const tip = document.getElementById("ncTip");
        if (tip) tip.style.display = "none";
      });

      // ---------- daily-row -> hourly window jump ----------

      resultEl.addEventListener("click", (e) => {
        const row = e.target.closest(".daily-row");
        if (!row || !wxData) return;
        const i = +row.dataset.i;
        const target =
          i === 0
            ? currentHourIndex(wxData)
            : wxData.hourly.time.indexOf(row.dataset.date + "T06:00");
        if (target < 0) return;
        setWindowStart(target);
        document
          .getElementById("chartWrap")
          .scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      // re-render charts when the layout crosses the compact breakpoint
      let resizeT;
      addEventListener("resize", () => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
          if (wxData && isCompact() !== compactState) {
            refreshChart();
            refreshOverview();
          }
        }, 150);
      });

      // ---------- settings sheet ----------

      const scrim = document.getElementById("scrim");
      const sheet = document.getElementById("settingsSheet");
      let lastFocus = null;

      function syncSegments() {
        for (const seg of sheet.querySelectorAll(".seg")) {
          const current = seg.dataset.unit ? units[seg.dataset.unit] : tone;
          for (const b of seg.querySelectorAll("button"))
            b.setAttribute("aria-pressed", String(b.dataset.value === current));
        }
      }

      function openSheet() {
        lastFocus = document.activeElement;
        syncSegments();
        sheet.setAttribute("aria-hidden", "false");
        sheet.classList.add("open");
        scrim.classList.add("open");
        document.body.style.overflow = "hidden";
        sheet.querySelector("button")?.focus();
      }

      function closeSheet() {
        sheet.classList.remove("open");
        scrim.classList.remove("open");
        sheet.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        lastFocus?.focus();
      }

      document.getElementById("settingsBtn").addEventListener("click", openSheet);
      scrim.addEventListener("click", closeSheet);
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
      });

      sheet.addEventListener("click", (e) => {
        const btn = e.target.closest(".seg button");
        if (!btn) return;
        const seg = btn.closest(".seg");
        if (seg.dataset.unit) {
          units[seg.dataset.unit] = btn.dataset.value;
          saveUnits();
        } else {
          tone = btn.dataset.value;
          localStorage.setItem("wx-tone", tone);
        }
        syncSegments();
        renderAll(); // metric data, new formatting — no refetch
      });

      // Swipe the sheet down to dismiss, the gesture phones expect.
      let dragY = null;
      sheet.addEventListener("pointerdown", (e) => {
        if (innerWidth >= 760 || sheet.scrollTop > 0) return;
        dragY = e.clientY;
      });
      sheet.addEventListener("pointermove", (e) => {
        if (dragY === null) return;
        const dy = Math.max(0, e.clientY - dragY);
        sheet.style.transform = `translateY(${dy}px)`;
      });
      const endDrag = (e) => {
        if (dragY === null) return;
        const dy = Math.max(0, e.clientY - dragY);
        dragY = null;
        sheet.style.transform = "";
        if (dy > 90) closeSheet();
      };
      sheet.addEventListener("pointerup", endDrag);
      sheet.addEventListener("pointercancel", endDrag);

      // ---------- install prompt ----------

      const installBanner = document.getElementById("installBanner");
      let deferredPrompt = null;

      addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Second visit onwards only — a first-load install nag is the fastest
        // way to lose the visit.
        const visits = +(localStorage.getItem("wx-visits") || 0);
        if (visits >= 2 && localStorage.getItem("wx-install-dismissed") !== "1")
          installBanner.classList.add("show");
      });

      document.getElementById("installBtn").addEventListener("click", async () => {
        installBanner.classList.remove("show");
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      });

      document
        .getElementById("installDismiss")
        .addEventListener("click", () => {
          installBanner.classList.remove("show");
          localStorage.setItem("wx-install-dismissed", "1");
        });

      addEventListener("appinstalled", () => {
        installBanner.classList.remove("show");
        localStorage.setItem("wx-install-dismissed", "1");
      });

      // ---------- service worker ----------

      if ("serviceWorker" in navigator)
        addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {}),
        );

      // ---------- init ----------

      localStorage.setItem(
        "wx-visits",
        String(+(localStorage.getItem("wx-visits") || 0) + 1),
      );
      if (!navigator.onLine) setOffline(true);

      renderRecents();
      const shared = placeFromUrl();
      const last = getLastPlace();
      if (shared) {
        input.value = shared.name;
        loadWeather(shared);
      } else if (last && last.latitude != null) {
        input.value = last.name === "My location" ? "" : last.name;
        loadWeather(last);
      } else {
        searchAndLoad("Warsaw");
      }
    </script>
  </body>
</html>
